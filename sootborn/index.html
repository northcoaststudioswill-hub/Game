<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SOOTBORN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ts:1;--op:.55;--cx:0px;--cy:0px;--cw:320px;--ch:180px;--rx:0px;--by:0px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
 --amber:#ffb35a;--cream:#f3e3c3;--rust:#8a5a3c;--ink:#140c10;--panel:#1a1115;--cyan:#4fd6d0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0709;color:var(--cream);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
#game{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0709}
body.g3on #game{background:transparent}
#ui{position:absolute;inset:0;pointer-events:none}
.hud{position:absolute;pointer-events:none;font-size:calc(11px*var(--ts));line-height:1.3;transition:opacity .3s}
#obj{left:calc(var(--cx) + 6px);top:calc(var(--cy) + 6px);max-width:calc(var(--cw)*.62);background:rgba(20,12,16,.82);border-left:3px solid var(--amber);padding:4px 8px;border-radius:2px}
#obj b{font-family:'Pixelify Sans',monospace;color:var(--amber);font-weight:500;display:block;font-size:.85em;letter-spacing:.08em}
#stat{right:calc(var(--rx) + 6px);top:calc(var(--cy) + 6px);background:rgba(20,12,16,.82);padding:4px 8px;border-radius:2px;text-align:right}
#hint{left:calc(var(--cx) + 8px);right:calc(var(--rx) + 8px);bottom:calc(var(--by) + 8px);text-align:center}
#hint span{background:rgba(20,12,16,.85);padding:4px 10px;border-radius:12px;border:1px solid #5e3a2c}
#toast{left:50%;transform:translateX(-50%);top:calc(var(--cy) + 40px);background:#2a1a14;border:2px solid var(--amber);padding:6px 12px;border-radius:4px;font-size:calc(12px*var(--ts));opacity:0;white-space:nowrap}
#toast.on{opacity:1}
.hidden{display:none!important}
/* dialogue */
#dlg{position:absolute;pointer-events:auto;background:rgba(18,11,14,.95);border:2px solid var(--rust);box-shadow:0 0 0 2px var(--ink),0 6px 18px rgba(0,0,0,.5);padding:10px 12px;border-radius:4px;display:flex;gap:10px;
 left:calc(var(--cx) + 10px);right:calc(var(--rx) + 10px);bottom:calc(var(--by) + 10px);max-height:70vh}
body.touch:not(.portrait) #dlg{left:max(calc(var(--cx) + 10px),calc(var(--sal) + 168px));right:max(calc(var(--rx) + 10px),calc(var(--sar) + 168px))}
body.portrait #dlg{top:calc(var(--cy) + var(--ch) + 10px);bottom:auto;left:10px;right:10px;max-height:calc(100vh - var(--cy) - var(--ch) - 20px);overflow:auto}
#dlg canvas{width:72px;height:72px;image-rendering:pixelated;background:#2a1a1a;border:1px solid #5e3a2c;flex:none}
#dlg .body{flex:1;min-width:0}
#dlg .nm{font-family:'Pixelify Sans',monospace;color:var(--amber);font-size:calc(15px*var(--ts));margin-bottom:2px}
#dlg .tx{font-size:calc(14px*var(--ts));line-height:1.5;min-height:3em;white-space:pre-wrap}
#dlg .more{float:right;color:var(--amber);animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.choices button{display:block;width:100%;text-align:left;margin-top:6px;min-height:44px;padding:8px 10px;background:#24171a;border:2px solid #3a2620;color:var(--cream);font:inherit;font-size:calc(13.5px*var(--ts));border-radius:3px;cursor:pointer}
.choices button.sel{border-color:var(--amber);background:#3a2418}
/* modal panels */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,7,.62);pointer-events:auto;padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px)}
.modal.clear{background:transparent}
.panel{width:min(520px,94vw);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--rust);box-shadow:0 0 0 2px var(--ink);padding:14px 16px;border-radius:6px}
.panel h2{font-family:'Pixelify Sans',monospace;font-weight:700;color:var(--amber);margin:0 0 8px;font-size:calc(20px*var(--ts));letter-spacing:.04em}
.panel p{font-size:calc(13px*var(--ts));line-height:1.5;margin:6px 0}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:46px;margin:6px 0;padding:8px 12px;background:#24171a;border:2px solid #3a2620;color:var(--cream);font:inherit;font-size:calc(14px*var(--ts));border-radius:4px;cursor:pointer;text-align:left}
.mi.sel{border-color:var(--amber);background:#33201a}
.mi[disabled]{opacity:.4;cursor:default}
.mi .v{color:var(--amber);white-space:nowrap}
.mi .v i{font-style:normal;opacity:.6;padding:0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .mi{flex:1}
textarea,input[type=text]{width:100%;background:#0e090b;color:var(--cream);border:2px solid #3a2620;border-radius:4px;font:inherit;font-size:16px;padding:8px;user-select:text;-webkit-user-select:text}
textarea{height:110px;font-size:12px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;min-height:40px;background:#24171a;border:2px solid #3a2620;color:var(--cream);font:inherit;font-size:calc(12px*var(--ts));border-radius:3px;cursor:pointer}
.tabs button.on{border-color:var(--amber);color:var(--amber)}
.card{background:#211518;border-left:3px solid var(--rust);padding:8px 10px;margin:6px 0;border-radius:2px}
.card b{font-family:'Pixelify Sans',monospace;font-weight:500;color:var(--amber);font-size:calc(14px*var(--ts))}
.card p{margin:4px 0 0}
.card.ghost{opacity:.6;border-left-color:#444}
.looks{display:flex;gap:8px;justify-content:center;margin:8px 0}
.looks canvas{width:64px;height:64px;image-rendering:pixelated;background:#2a1a1a;border:2px solid #3a2620;border-radius:4px;cursor:pointer}
.looks canvas.on{border-color:var(--amber)}
/* title & cards */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;padding:calc(var(--sat) + 8px) 8px calc(var(--sab) + 8px)}
.logo{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(34px,8vw,64px);letter-spacing:.06em;color:var(--amber);text-shadow:0 3px 0 #6a2a14,0 0 24px rgba(255,140,60,.45);margin:0;text-align:center;line-height:1}
.sub{font-size:calc(12px*var(--ts));opacity:.75;letter-spacing:.3em;text-transform:uppercase;margin:8px 0 14px;text-align:center}
#title .menu{width:min(300px,86vw)}
.press{font-family:'Pixelify Sans',monospace;font-size:18px;animation:blink 1.2s steps(2) infinite;margin-top:24px}
@keyframes blink{50%{opacity:.25}}
.cine{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;text-align:center;padding:24px}
.cine p{max-width:560px;font-size:calc(16px*var(--ts));line-height:1.6;transition:opacity .8s;margin:0}
.skip{position:absolute;left:calc(var(--sal) + 12px);top:calc(var(--sat) + 12px);min-height:44px;padding:6px 14px;background:rgba(36,23,26,.8);border:2px solid #3a2620;color:var(--cream);font:inherit;border-radius:4px}
/* splash */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07090d;pointer-events:auto;transition:opacity .7s}
.splash .mark{transition:opacity .9s, transform .9s;opacity:0;transform:translateY(6px);text-align:center}
.splash .mark.on{opacity:1;transform:none}
.ncs-lake{width:132px;height:58px;image-rendering:pixelated;display:block;margin:0 auto 12px}
.ncs-name{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(24px,6vw,40px);letter-spacing:.14em;color:#e8f1f6}
.ncs-tag{font-size:11px;letter-spacing:.5em;color:#7fb4cf;margin-top:6px}
.ec-e{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(56px,14vw,96px);line-height:1;color:#0b0709;background:var(--amber);width:1.25em;height:1.25em;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border-radius:10px;box-shadow:0 0 0 4px #0b0709,0 0 0 7px var(--amber)}
.ec-name{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(22px,5vw,34px);letter-spacing:.3em;color:var(--cream)}
.splash .with{font-size:11px;letter-spacing:.4em;color:#9a8a80;margin-bottom:14px;text-transform:uppercase}
/* puzzle bar */
#pbar{position:absolute;right:calc(var(--rx) + 6px);top:calc(var(--cy) + 6px);display:flex;gap:6px;pointer-events:auto}
#pbar button{min-height:40px;min-width:64px;background:rgba(36,23,26,.92);border:2px solid #5e3a2c;color:var(--cream);font:inherit;font-size:calc(12px*var(--ts));border-radius:4px}
/* touch controls */
#controls{position:absolute;inset:0;pointer-events:none;opacity:var(--op)}
#controls > *{pointer-events:auto;position:absolute;touch-action:none}
body:not(.touch) #controls,body:not(.ingame) #controls{display:none}
#dpad{width:150px;height:150px;left:calc(var(--sal) + 14px);bottom:calc(var(--sab) + 14px);border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12)}
#dpad i{position:absolute;background:#3a2c34;border-radius:8px;box-shadow:0 3px 0 #1a1218}
#dpad i.h{left:8%;right:8%;top:35%;height:30%}
#dpad i.v{top:8%;bottom:8%;left:35%;width:30%}
#dpad b{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--amber);left:50%;top:50%;margin:-13px 0 0 -13px;opacity:.85;transition:transform .05s}
.pb{width:72px;height:72px;border-radius:50%;border:0;font-family:'Pixelify Sans',monospace;font-size:26px;font-weight:700;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#bA{right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 62px);background:#c8552e}
#bB{right:calc(var(--sar) + 100px);bottom:calc(var(--sab) + 18px);background:#4a3a48}
.fb{width:54px;height:54px;font-size:11px;letter-spacing:.5px;display:none}
body.fight .fb{display:block}
#bY{right:calc(var(--sar) + 25px);bottom:calc(var(--sab) + 144px);background:#3a6a8a}
#bX{right:calc(var(--sar) + 100px);bottom:calc(var(--sab) + 100px);background:#8a5a2a}
#bR{right:calc(var(--sar) + 182px);bottom:calc(var(--sab) + 22px);background:#4a5a7a}
#bL{right:calc(var(--sar) + 174px);bottom:calc(var(--sab) + 90px);background:#5a5a4a}
body.portrait #bY{right:32px;bottom:calc(var(--sab) + 180px)}
body.portrait #bX{right:122px;bottom:calc(var(--sab) + 124px)}
body.portrait #bR{right:104px;bottom:calc(var(--sab) + 206px)}
body.portrait #bL{right:32px;bottom:calc(var(--sab) + 252px)}
#bM{right:calc(var(--sar) + 12px);top:calc(var(--sat) + 10px);min-height:44px;min-width:64px;border-radius:22px;border:2px solid #5e3a2c;background:rgba(36,23,26,.9);color:var(--cream);font:inherit;font-size:13px}
body.portrait #controls{opacity:1}
body.portrait #dpad{width:168px;height:168px;left:calc(var(--sal) + 18px);bottom:calc(var(--sab) + 26px)}
body.portrait #bA{right:20px;bottom:calc(var(--sab) + 90px);width:78px;height:78px}
body.portrait #bB{right:110px;bottom:calc(var(--sab) + 34px);width:78px;height:78px}
body.portrait #bM{right:auto;left:50%;transform:translateX(-50%);top:auto;bottom:calc(var(--sab) + 214px)}
body.ctlfade #controls{opacity:calc(var(--op)*.5)}
body.portrait #obj{top:calc(var(--cy) + var(--ch) + 8px);left:10px;max-width:calc(100vw - 190px);right:auto}
body.portrait #stat{top:calc(var(--cy) + var(--ch) + 8px);right:10px}
body.portrait.inpuzzle #obj{right:150px}
body.portrait #pbar{top:calc(var(--cy) + var(--ch) + 8px);right:10px}
body.portrait #hint{bottom:auto;top:calc(var(--cy) + var(--ch) + 64px)}
#card{position:absolute;inset:0;background:#030204;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:auto;opacity:0;transition:opacity .9s}
#card.on{opacity:1}
#card p{max-width:560px;font-size:calc(17px*var(--ts));line-height:1.6;margin:6px 0;letter-spacing:.02em}
#card p.s{opacity:.7;font-size:calc(14px*var(--ts))}
#card .bigt{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(46px,13vw,104px);letter-spacing:.12em;color:var(--amber);text-shadow:0 4px 0 #5a1a08,0 0 40px rgba(255,120,40,.5)}
#card .bigs{margin-top:10px;font-size:calc(13px*var(--ts));letter-spacing:.25em;text-transform:uppercase;opacity:.75}
#cskip{position:absolute;right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 10px);min-height:44px;padding:6px 14px;background:rgba(36,23,26,.85);border:2px solid #3a2620;color:var(--cream);font:inherit;border-radius:4px;pointer-events:auto;z-index:5}
#dbg{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.7);padding:4px;white-space:pre;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.press,#dlg .more{animation:none}}

/* art pass: panels framed like engraved brass plates */
:root{--gold:#c8a050;--goldL:#f0d48a;--goldD:#6a5228}
#dlg,.panel{border:2px solid var(--gold);border-radius:3px;box-shadow:0 0 0 1px #0c0808,0 0 0 3px var(--goldD),0 0 0 4px #0c0808,inset 0 0 0 1px #0c0808,inset 0 0 0 2px #3a2a1c,0 8px 22px rgba(0,0,0,.6)}
.panel{background:linear-gradient(#1c1316,#150e11)}
#dlg{background:linear-gradient(rgba(30,20,22,.97),rgba(18,11,14,.97))}
.panel h2{border-bottom:1px solid var(--goldD);padding-bottom:6px;text-shadow:0 2px 0 #4a2a10}
.panel h2::before{content:'\25C6\00a0';color:var(--gold);font-size:.7em;vertical-align:middle}
#dlg canvas{border:2px solid var(--gold);box-shadow:0 0 0 1px #0c0808}
#obj{border:1px solid var(--goldD);border-left:3px solid var(--gold);background:rgba(22,14,16,.9)}
#stat{border:1px solid var(--goldD);background:rgba(22,14,16,.9)}
#toast{border:2px solid var(--gold);box-shadow:0 0 0 1px #0c0808,0 0 0 3px var(--goldD);background:#1e1512;border-radius:2px;letter-spacing:.06em}
.mi{border:1px solid #4a3626;border-left:3px solid #4a3626;background:linear-gradient(#281a1c,#201417);border-radius:2px}
.mi.sel{border-color:var(--gold);border-left-color:var(--goldL);background:linear-gradient(#3a2618,#2a1a16);color:#fff3d8}
.card{border:1px solid #3a2a22;border-left:3px solid var(--gold);background:#1e1416}
.tabs button.on{border-color:var(--gold);color:var(--goldL);background:#33201a}
#hint span{border:1px solid var(--goldD)}
.modal.clear .panel{box-shadow:0 0 0 1px #0c0808,0 0 0 3px var(--goldD),0 0 0 4px #0c0808,0 8px 22px rgba(0,0,0,.6)}

/* story panels: a slim caption strip so the picture stays visible */
body.inpanel:not(.portrait) #dlg{padding:6px 10px;background:linear-gradient(rgba(20,13,15,.84),rgba(12,8,10,.9));bottom:calc(var(--by) + 6px)}
body.inpanel:not(.portrait) #dlg canvas{width:44px;height:44px}
body.inpanel:not(.portrait) #dlg .tx{min-height:0;line-height:1.4}
</style>
</head>
<body>
<canvas id="game" width="320" height="180" aria-label="Below the Sun game screen"></canvas>
<div id="ui">
  <div id="obj" class="hud hidden"><b>OBJECTIVE</b><span></span></div>
  <div id="stat" class="hud hidden"></div>
  <div id="hint" class="hud hidden"><span></span></div>
  <div id="toast" class="hud"></div>
  <div id="pbar" class="hidden"><button id="pHint">Hint</button><button id="pLeave">Leave</button></div>
  <div id="dlg" class="hidden"><canvas width="32" height="32"></canvas><div class="body"><div class="nm"></div><div class="tx"></div><div class="choices"></div></div></div>
  <div id="layer"></div>
  <div id="card" class="hidden"></div>
  <button id="cskip" class="hidden">Skip scene ▸▸</button>
</div>
<div id="controls">
  <div id="dpad" aria-label="Direction pad"><i class="h"></i><i class="v"></i><b></b></div>
  <button class="pb" id="bA" aria-label="A: interact / confirm">A</button>
  <button class="pb" id="bB" aria-label="B: cancel / back">B</button>
  <button class="pb fb" id="bY" aria-label="Jump">JUMP</button>
  <button class="pb fb" id="bX" aria-label="Kick">KICK</button>
  <button class="pb fb" id="bR" aria-label="Guard">GUARD</button>
  <button class="pb fb" id="bL" aria-label="Hook line">HOOK</button>
  <button id="bM" aria-label="Menu">☰ Menu</button>
</div>
<div id="dbg" class="hidden"></div>
<div id="safe" style="position:absolute;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>
<script>
// ---- src/core.js
// ============================================================
// core/ — constants, settings, storage, input, audio, layout
// ============================================================
'use strict';
let W = 320, H = 180; const TS = 16, STEP = 1 / 60; // W narrows to 208 in portrait for a bigger picture
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hash(x, y) { let h = (x * 374761393 + y * 668265263) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- platform: storage adapter (localStorage if it works, memory otherwise)
const Store = {
  ok: false, mem: {},
  init() { try { localStorage.setItem('bts_probe', '1'); localStorage.removeItem('bts_probe'); this.ok = true; } catch (e) { this.ok = false; } },
  get(k) { if (this.ok) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) { } } return k in this.mem ? this.mem[k] : null; },
  set(k, v) { this.mem[k] = v; if (this.ok) { try { localStorage.setItem(k, v); return true; } catch (e) { } } return false; }
};

// ---------- settings
const Settings = {
  d: { music: 6, sfx: 8, text: 1, speed: 1, highlight: 0, reduce: 0, touch: 'auto', op: 60, diff: 1 },
  load() { try { const s = JSON.parse(Store.get('bts_settings') || 'null'); if (s) Object.assign(this.d, s); } catch (e) { } },
  save() { Store.set('bts_settings', JSON.stringify(this.d)); },
  apply() {
    const r = document.documentElement.style;
    r.setProperty('--ts', [0.9, 1, 1.15, 1.3][this.d.text] || 1);
    r.setProperty('--op', this.d.op / 100);
    if (this.d.reduce === 0 && matchMedia('(prefers-reduced-motion: reduce)').matches && !this.d._asked) { this.d.reduce = 1; this.d._asked = 1; }
    Sound.setVol(); Layout.update();
  }
};

// ---------- input abstraction: keyboard + touch + gamepad -> actions
const ACTIONS = ['up', 'down', 'left', 'right', 'A', 'B', 'START', 'L', 'R', 'Y', 'X'];
const Input = {
  held: {}, pressed: {}, kb: {}, touch: {}, pad: {}, queued: new Set(), hold: {}, device: 'kb', touchSeen: false,
  keymap: { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyE: 'A', Enter: 'A', Space: 'A', KeyZ: 'A', Escape: 'B', KeyX: 'B', Backspace: 'B', KeyM: 'START', Tab: 'START', KeyP: 'START', KeyQ: 'L', KeyR: 'R', KeyH: 'Y', KeyJ: 'R', KeyC: 'X', KeyF: 'Y', KeyV: 'R', KeyG: 'L' },
  typing(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'); },
  init() {
    addEventListener('keydown', e => {
      if (e.code === 'Backquote') { Debug.toggle(); return; }
      if (this.typing(e)) return;
      const a = this.keymap[e.code];
      if (a) { e.preventDefault(); if (!this.kb[a]) this.queued.add(a); this.kb[a] = true; this.setDevice('kb'); }
      Sound.unlock();
    });
    addEventListener('keyup', e => { const a = this.keymap[e.code]; if (a) this.kb[a] = false; });

const Layout = {

  update() {
    const vw = innerWidth, vh = innerHeight, sa = this.safe();

    const lw = portrait ? 208 : 320, cvs = $('#game');
    if (W !== lw) { W = lw; cvs.width = W; cvs.getContext('2d').imageSmoothingEnabled = false; }

function renderMapLayer(m) {
  const [c, g] = mk(m.w * 16, m.h * 16);
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) drawTile(g, m, x, y);
  g.fillStyle = 'rgba(6,3,5,.42)'; for (const p of m.props) if (p.block) for (const [bx, by] of p.block) { g.fillRect(bx * 16 + 1, by * 16 + 12, 15, 5); g.fillRect(bx * 16 + 3, by * 16 + 17, 12, 1); }
  for (const p of m.props) { const fn = PROPS[p.t]; if (fn) fn(g, p.x * 16, p.y * 16, p.w || p.a, p.h); }
  return c;
}

const F = k => !!G.flags[k];
const setF = k => { G.flags[k] = 1; };
const fury = n => { G.flags.fury = (G.flags.fury || 0) + n; };
const say = (s, t) => ({ s, t });
const narr = t => ({ s: 'narr', t });
const fx = fn => ({ fx: fn });
const TEND = { caretaker: 'Heart', tinkerer: 'Pride', seeker: 'Hunger' };
const byTend = o => o[G.tendency] ? [narr(o[G.tendency])] : [];

function buildMap(def) {

function DAY4() {

    { say: 'kael', t: 'Gauges lie all the time. You put your hand on the pipe.' },
    { say: 'wren', t: 'One... touches it?' },
    { say: 'kael', t: 'We do. Down there. Aye.' },
    { say: 'wren', t: '"We." What a useful word. One is never allowed it.' },
    { narr: 'Wren Halloran. Nineteen, and the only one of the forty who ever got grease on a cuff. She asks me once where I learned it. I say: Tier Six. She writes that down as if it were a school.' },
    { pstage: 2 },
    { say: 'celestine', t: 'You have stopped saying "aye," technician.' },
    { say: 'kael', t: 'Noted.' },
    { narr: 'She laughed. It is the only time I ever heard it. I added it to the list.' },
    { fade: 'out' }, { panel: 'kael' }, { fade: 'in', spd: 0.8 }, { wait: 0.6 },
    { narr: 'Below, I am the most boring man on Tier Six. I fix valves. I eat at Ivo\'s. I let Proctor Sull win an argument about a gauge, twice, in front of people.' },
    { fade: 'out' }, { panel: 'freight' }, { fade: 'in', spd: 0.8 }, { wait: 0.6 },
    { say: 'sable', t: 'So you\'re the one Dace keeps under the floor like a bad secret. I\'m Sable. I run Freight Three, which means I decide what nobody saw arrive.' },
    { pstage: 1 }, { wait: 1 },
    { say: 'sable', t: 'Cold crates. Greens, from somewhere with dirt and daylight. They come down marked for the Spire kitchens and four in forty go missing on my count. Nell\'s ward gets them.' },
    { say: 'sable', t: 'You\'ve seen where they grow, haven\'t you. Don\'t tell me. I like not knowing. It keeps my face honest.' },
    { fade: 'out' }, { panel: 'row' }, { fade: 'in', spd: 0.8 }, { wait: 0.6 },
    { say: 'mara', t: 'You\'ve gone quiet. You were never quiet, not once in all your breath. You\'re leaving.' },

    ] },
    { say: 'mara', t: 'Tavi will ask. I\'ll say you went to fix something big. That\'s true, isn\'t it?' },
    { say: 'kael', t: 'The biggest valve there is.' },
    { say: 'mara', t: 'Be too much for them. I heard her say it. Go on, then. And Kael. Come back taller.' },
    { say: 'tavi', t: 'Kael? I finished her lantern. The proper one, not the potato. I\'m keeping it for next year so you can light it.' },
    { say: 'kael', t: 'Light it yourself, Tav. You\'ve got steadier hands than me.' },
    { narr: 'That was goodbye. Tavi did not know it. I have gone over it since, more often than the furnace.' },
    { fade: 'out' }, { music: 'mystery' }, { panel: 'under' }, { pstage: 1 }, { fade: 'in', spd: 0.8 }, { wait: 0.8 },
    { say: 'dace', t: 'Tonight. They dropped the watch on you to one Proctor a week ago. Sable sold him a bottle this afternoon.' },
    { say: 'dace', t: 'A man can\'t just vanish down here. The count wouldn\'t balance, and the count always balances. Kael Brennick has to die on paper.' },
    { say: 'dace', t: 'A seal fails on the Bay Three furnace line. You went in to fix it. Mara signs as witness. They send her a tin. Nobody looks for a man they have already weighed.' },
    { say: 'kael', t: 'She\'ll have two tins.' },
    { say: 'dace', t: 'She knows. She said to tell you she\'s running out of shelf.' },
    { pstage: 2 }, { sfx: 'door' }, { wait: 1.2 },
    { narr: 'Light, down through the hatch. Not the Proctor with the bottle. Sull, sober, with the night watch behind him, and four months of wondering why I had stopped arguing.' },
    { fade: 'out' }, { panel: null },
    { brawl: () => FF.wayout() },
    { panel: 'under' }, { pstage: 1 }, { fade: 'in', spd: 0.8 }, { wait: 0.8 },
    { narr: 'Sull, on his back, looking up at me the way a man looks at a gauge that cannot be right.' },
    { say: 'proctor', t: 'Brennick. They\'ll burn the whole row for this.' },
    { say: 'dace', t: 'No. Because you are going to write that Kael Brennick went into the furnace line after a failed seal, and that you tried to pull him out. You\'ll get a commendation. Or the Inspector hears who has been selling watch shifts by the bottle.' },
    { say: 'proctor', t: '...Noted.' },
    { fade: 'out' }, { panel: 'row' }, { fade: 'in', spd: 0.8 }, { wait: 0.8 }, { pstage: 1 },
    { narr: 'Two days later a tin goes to Row K. Authority grey, a little sun stamped on the lid. Mara signs for it. There is nothing in it. She puts it on the shelf beside the other one.' },
    { fade: 'out' }, { panel: 'under' }, { fade: 'in', spd: 0.8 }, { wait: 0.8 },
    { narr: 'I go out through the old tunnel, past Seren\'s suns. I touch every one of them. Then the hatch, and a stair I did not know was there, and at the top of it a tall woman with gold in her eyes.' },

const UI = {
  stack: [],
  top() { return this.stack[this.stack.length - 1]; },
  push(m) { for (const s of this.stack) s.el.style.display = 'none'; this.stack.push(m); $('#layer').appendChild(m.el); Input.consume(); HUD.dirty = true; },
  pop() { const m = this.stack.pop(); if (!m) return; m.el.remove(); const t = this.top(); if (t) { t.el.style.display = ''; t.refresh && t.refresh(); } m.onClose && m.onClose(); Input.consume(); HUD.dirty = true; },
  clear() { while (this.stack.length) { const m = this.stack.pop(); m.el.remove(); } HUD.dirty = true; }
};
// opts: {title, build(panel), items:[{label, value(), act(), adj(dir), disabled()}], onBack, clear, tabs}
function modal(opts) {
  const el = document.createElement('div'); el.className = 'modal' + (opts.clear ? ' clear' : '');
  const panel = document.createElement('div'); panel.className = 'panel'; el.appendChild(panel);
  if (opts.title) { const h = document.createElement('h2'); h.textContent = opts.title; panel.appendChild(h); }
  const body = document.createElement('div'); panel.appendChild(body);
  const list = document.createElement('div'); panel.appendChild(list);
  const m = {
    el, panel, body, sel: 0, items: opts.items || [], opts, born: G.time,
    refresh() {
      if (opts.build) { body.innerHTML = ''; opts.build(body, m); }
      list.innerHTML = '';
      m.items.forEach((it, i) => {
        const b = document.createElement('button'); b.className = 'mi';
        const dis = it.disabled && it.disabled(); if (dis) b.disabled = true;
        const v = it.value ? `<span class="v">${it.adj ? '<i>◀</i>' : ''}${esc(it.value())}${it.adj ? '<i>▶</i>' : ''}</span>` : '';
        b.innerHTML = `<span>${esc(typeof it.label === 'function' ? it.label() : it.label)}</span>${v}`;
        b.onclick = e => { m.sel = i; if (it.adj) { const r = b.getBoundingClientRect(); it.adj(e.clientX && e.clientX < r.left + r.width * 0.55 && it.value ? -1 : 1); Sound.play('move'); m.refresh(); } else if (it.act) { Sound.play('ok'); it.act(); } };
        list.appendChild(b);
      });
      m.hl();
    },
    hl() { [...list.children].forEach((b, i) => b.classList.toggle('sel', i === m.sel)); const s = list.children[m.sel]; if (s && s.scrollIntoView && Input.device !== 'touch') s.scrollIntoView({ block: 'nearest' }); },
    move(d) { const n = m.items.length; if (!n) return; for (let k = 0; k < n; k++) { m.sel = (m.sel + d + n) % n; const it = m.items[m.sel]; if (!(it.disabled && it.disabled())) break; } m.hl(); Sound.play('move'); },
    update() {
      if (G.time - m.born < 0.3) return;
      if (opts.tabs) { if (Input.p('L')) opts.tabs(-1); if (Input.p('R')) opts.tabs(1); }
      if (Input.rep('up')) m.move(-1); if (Input.rep('down')) m.move(1);
      const it = m.items[m.sel];
      if (it && it.adj) { if (Input.rep('left')) { it.adj(-1); Sound.play('move'); m.refresh(); } if (Input.rep('right')) { it.adj(1); Sound.play('move'); m.refresh(); } }
      else if (opts.tabs) { if (Input.p('left')) opts.tabs(-1); if (Input.p('right')) opts.tabs(1); }
      if (Input.p('A') && it && !(it.disabled && it.disabled())) { if (it.act) { Sound.play('ok'); it.act(); } else if (it.adj) { it.adj(1); m.refresh(); } }
      if ((Input.p('B') || (Input.p('START') && opts.startCloses)) && opts.onBack !== null) { Sound.play('back'); (opts.onBack || (() => UI.pop()))(); }
    }
  };
  m.onClose = opts.onClose;
  const first = m.items.findIndex(it => !(it.disabled && it.disabled())); m.sel = first < 0 ? 0 : first;
  m.refresh();
  return m;
}

// ---------- boot splash: North Coast Studios, then E Concepts
const Splash = {
  run(done) {
    const el = document.createElement('div'); el.className = 'splash';
    el.innerHTML = `<div class="mark" id="spA"><canvas class="ncs-lake" width="66" height="29"></canvas><div class="ncs-name">NORTH COAST</div><div class="ncs-tag">STUDIOS</div></div>`;
    $('#layer').appendChild(el);
    this.drawLake(el.querySelector('canvas'));
    let step = 0, timer = null;
    const next = () => {
      clearTimeout(timer); step++;
      if (step === 1) { el.querySelector('#spA').classList.add('on'); Sound.play('splash'); timer = setTimeout(next, 2200); }
      else if (step === 2) { el.querySelector('#spA').classList.remove('on'); timer = setTimeout(next, 700); }
      else if (step === 3) { el.innerHTML = `<div class="mark" id="spB"><div class="with">in association with</div><div class="ec-e">E</div><div class="ec-name">CONCEPTS</div></div>`; requestAnimationFrame(() => requestAnimationFrame(() => el.querySelector('#spB').classList.add('on'))); timer = setTimeout(next, 2200); }
      else if (step === 4) { el.style.opacity = 0; timer = setTimeout(next, 700); }
      else { el.remove(); window.removeEventListener('keydown', skip, true); done(); }
    };
    const t0 = performance.now(); const skip = () => { if (performance.now() - t0 < 900) return; if (step < 3) { step = 2; next(); } else if (step === 3) next(); };
    el.addEventListener('pointerdown', skip); window.addEventListener('keydown', skip, true);
    Splash.padSkip = skip;
    setTimeout(next, 250);
  },
  drawLake(c) {

    R(0, 15, 66, 14, '#16324a'); for (let y = 16; y < 29; y += 2) for (let x = (y * 3) % 7; x < 66; x += 7) R(x, y, 3, 1, '#2a5a7a');
    R(29, 16, 8, 1, '#e8a050'); R(31, 18, 5, 1, '#c88040'); R(32, 20, 3, 1, '#a86a3a');
    R(52, 4, 4, 12, '#e8e0d0'); R(52, 7, 4, 2, '#c8452e'); R(52, 11, 4, 2, '#c8452e'); R(51, 2, 6, 2, '#2a2a30'); R(53, 1, 2, 1, '#ffd890'); R(48, 15, 14, 2, '#2a2420');

const Intro = {
  i: 0, t: 0, el: null,
  start() {

    el.innerHTML = '<p></p><button class="skip">Skip ▸▸</button>'; $('#layer').appendChild(el);

  show() { const p = this.el.querySelector('p'); p.style.opacity = 0; setTimeout(() => { p.textContent = INTRO_CARDS[this.i]; p.style.opacity = 1; }, 150); this.t = 0; },
  adv() { if (this.t < 0.4) return; this.i++; if (this.i >= INTRO_CARDS.length) this.finish(); else { Sound.play('blip'); this.show(); } },
  update(dt) { this.t += dt; if (Input.p('A')) this.adv(); if (Input.p('B') || Input.p('START')) this.finish(); if (this.t > 6) this.adv(); },
  finish() { if (G.mode !== 'intro') return; this.el.remove(); Sound.play('bell'); G.mode = 'world'; Fade.a = 1; Fade.dir = -1; Fade.sp = 0.8; Fade.busy = true; Sound.music('home'); Game.autosave(); }

    const g = (id, x, y, dir, wander) => ({ id, patrol: 1, x: x * 16 + 8, y: y * 16 + 12, dir, home: dir, wander, wi: 0, wait: 1.6, anim: 0, moving: false, face: 0, barkCd: 99 });

      g('proctor', 7, 6, 0, G.flags.relayCut ? HEIST_LANE_N : HEIST_LANE_MID),
      g('watchman', 12, 10, 2, [[12, 10, 2, 0.9], [12, 10, 3, 0.9], [12, 3, 3, 0.9], [12, 3, 2, 0.9]]),

      ...(b ? [
        narr('He opens his notebook. He turns it around so you can read it. Nobody has ever seen inside Vale\'s notebook.'),
        narr('"BANK 7. CLINIC BRANCH +3% FOR 61 MIN. OPERATOR: K.B." And through all of it, one clean stroke of the pen.'),
        say('vale', 'I wrote it down. I write everything down. Then I struck it. I have never struck anything.'),
        { choice: [
          { t: 'Why?', fx: () => setF('valeWhy'), then: [say('vale', 'Tier 8. Thirty years ago. A fever ward with twelve cots, and my sister in the ninth.'), say('vale', 'Nobody bled a line for her. I have often wondered what kind of man would have.'), say('vale', 'Now I know. He is insolent, and he is going to get people killed.')] },
          { t: 'What do you want for it?', fx: () => setF('valeDebt'), then: [say('vale', 'Want. Spoken like a man who expects a price. Good. You are learning how up there works.'), say('vale', 'One day I will ask you for a silence. You will give it. That is the price.')] },
          { t: "Strike it or don't. I'd do it again tonight.", fx: () => { setF('valeDefied'); fury(1); }, then: [say('vale', "Yes. She said that too. Those exact words, to an Accredited's face."), say('vale', 'You people keep saying it as though it were a defense.')] }
        ] }
      ] : nc ? [
        say('vale', "Yesterday you had your hands in the clinic coupling. Don't. I can smell a lie the way you can smell a leak."),
        say('vale', 'I wrote: "Operator inspecting branch seal." It is a generous sentence. I do not have many.')
      ] : [
        say('vale', 'A clean shift yesterday. Bank balanced. Mouth mostly shut. I wrote: "Compliant." Do you know how rarely I get to use that word?'),
        say('you', 'Frame it.')
      ]),
      ...(F('threatenedProctor') ? [say('vale', 'Proctor Sull has filed on you. I have delayed the filing. Paper moves slowly when I sit on it. I will not sit on it twice.')] : []),
      ...(F('spareOn') ? [say('vale', 'And the spare breaker is warm.'), narr('He looks at it. He looks at you. He does not write.'), say('vale', 'A faulty panel. Forty years old. I shall note the age of the panel.')] : []),
      say('vale', 'The High Auditor is coming down for First Fire. She lights it herself, some years. She asked whether "the loud one" still works Bank Seven.'),
      say('you', 'What did you tell her?'),
      say('vale', 'That you were quiet now.'),
      say('vale', 'Make me honest, Brennick. For one night. Carry your little lantern. Stand in your row. Go home.'),
      { choice: [
        { t: "I'll be a model of gratitude.", then: [say('vale', 'You will be a model of something.')] },
        { t: '(Say nothing.)', then: [say('vale', 'Better.')] },
        { t: 'Ask her why the lift runs on our lights.', fx: () => { setF('valeAsked'); fury(1); }, then: [say('vale', '...You read the plate.'), say('vale', 'Then you already know more than is safe, and I already know less than I would like.')] }
      ] },
      narr('At the door he stops, without turning.'),
      say('vale', 'Morrow went looking under the floor. Do not go looking under the floor.'),
      fx(() => { setF('vale2Done'); Sound.play('door'); Game.autosave(); })
    ], () => World.afterBeat());
  },
  startFestival() {
    Game.autosave(); Dialogue.end();
    Fade.go(() => Cutscene.play(festA(), () => Game.startFestStealth()), 1.5, true);
  },
  startFestStealth() {
    G.heist = 2; G.flags.caught2 = 0; G.flags.heistEase = F('sullTip') || F('beatSull') ? 1 : 0;
    World.load('fest', { x: 7 * 16 + 8, y: 13 * 16 + 4, dir: 1 }, true); G.mode = 'world'; Game.resetHeist(); Sound.music('mystery');
    Fade.a = 1; Fade.dir = -1; Fade.sp = 1; Fade.busy = true;

  },
  resetFest() {

    const g = (id, x, y, dir, wander) => ({ id, patrol: 1, x: x * 16 + 8, y: y * 16 + 12, dir, home: dir, wander, wi: 0, wait: 1.2, anim: 0, moving: false, face: 0, barkCd: 99 });
    const s = (id, x, y, dir) => ({ id, x: x * 16 + 8, y: y * 16 + 12, dir, home: dir, anim: 0, moving: false, face: 0, barkCd: 99 });
    World.npcs = [
      g('proctor', 9, 6, 3, [[17, 6, 0, 1.4], [17, 11, 2, slow], [9, 11, 1, slow], [9, 6, 3, 1.4]]),
      g('watchman', 13, 12, 2, [[13, 12, 2, 2], [13, 12, 1, 1.6], [13, 12, 3, 2], [13, 12, 1, 1.6]]),
      g('watchman', 13, 5, 0, [[13, 5, 2, 2.1], [13, 5, 0, 1.5], [13, 5, 3, 2.1], [13, 5, 0, 1.5]]),
      s('tavi', 6, 13, 3), s('ivo', 8, 14, 1), s('mara', 3, 6, 3), s('hollis', 2, 8, 3), s('marrow', 3, 10, 3), s('pell', 2, 12, 3), s('bao', 5, 11, 3), s('juno', 10, 14, 1), s('orin', 12, 14, 1), s('nell', 17, 14, 1), s('fen', 20, 14, 1), s('kit', 24, 10, 2)

    if (F('sullWar') && !F('beatSull')) World.npcs.push(g('watchman', 20, 8, 2, [[20, 8, 2, 2], [20, 8, 1, 1.5], [20, 8, 2, 2], [20, 8, 0, 1.5]]));
    World.caughtT = 0; World.alert = 0; World.alertPeak = 0; World.work = 0; World.seenBy = null; World.grace = 2.2;
    if ((G.flags.caught2 | 0) >= 2) { // Ivo gets clumsy with his cart: every lamp turns east
      setTimeout(() => { if (G.heist !== 2) return; Sound.play('rumble'); Sound.play('clink'); for (const n of World.npcs) if (n.patrol) { n.inv = { x: 23 * 16 + 8, y: 13 * 16 }; n.invT = 0; n.invGive = 0; n.bark = { t: '?!', life: 1.4 }; } const iv = World.npcs.find(n => n.id === 'ivo'); if (iv) iv.bark = { t: 'OH NO. MY CART.', life: 2.4 }; }, 1400);
    }
  },
  onFestDone() {
    G.heist = 0; World.bolt = null; World.ripple = null; World.dynLights = []; World.npcs = []; setF('hungLantern'); Sound.play('ok');
    Cutscene.play(festB(), () => DayEnd.run(2));
  }
};
World.showPlayer = true;

// patch render to respect showPlayer (title screen pans an empty square)
const _wr = World.render.bind(World);
World.render = function (g, t) {
  if (this.showPlayer) return _wr(g, t);
  const keep = P.sheet; P.sheet = BLANK; const r = _wr(g, t); P.sheet = keep; return r;
};
const [BLANK] = mk(48, 64);

const canvas = $('#game'), ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect(), lx = (e.clientX - r.left) / r.width * W, ly = (e.clientY - r.top) / r.height * H;
  if (UI.stack.length) return;
  if (Puzzle.active) { Puzzle.tap(lx, ly); return; }
  if (Dialogue.active && !Dialogue.choices) Dialogue.advance();
  else if (Cutscene.active) Cutscene.tapped = true;
});
$('#card').addEventListener('pointerdown', () => { Cutscene.tapped = true; });
window.addEventListener('pointerdown', () => { if (Brawl.active && Brawl.cine) Brawl.tap = true; }); window.addEventListener('keydown', e => { if (Brawl.active && Brawl.cine && Brawl.def.cineOnly && !e.repeat) Brawl.tap = true; });
$('#cskip').addEventListener('click', e => { e.stopPropagation(); Cutscene.skip(); });

const ZC = { c: null, g: null };
const BLEED2 = { name: 'BANK 7 · BLEED AGAIN', timer: 28, tip: "Feed AUX-9 into the clinic branch before Vale walks back. Don't get caught with your hands in it.", cols: 4, rows: 3, cells: [
  ['SRC:E:AUX9', 'EW', 'SW', ''],
  ['', 'ES', 'NSW', ''],
  ['', 'NE', 'NEW', 'OUT:W:CLINIC']],
  onFail: () => { setF('nearlyCaught'); Sound.play('alarm'); World.fxFlash('#ff3020', 0.3); Dialogue.start([narr("Boots on the grating. You snap the coupling back a half-second before Vale's shadow falls across the bank."), say('vale', 'Admiring your work, Brennick?'), say('kael', "Somebody should. You won't."), say('vale', '...Hm.'), narr('He writes something down. Your hands do not stop shaking until the next bell.')], () => World.afterBeat()); } };
let booted = false;
function boot() {
  Store.init(); Settings.load(); Input.init(); Settings.apply(); Layout.update();
  addEventListener('resize', () => Layout.update()); addEventListener('orientationchange', () => setTimeout(() => Layout.update(), 200));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (G.mode === 'world' && !UI.stack.length && !Dialogue.active && !Brawl.active) { if (Puzzle.active) Puzzle.close(); Menus.pause(); } Sound.suspend(); }
    else Sound.resume();
  });
  // press-to-start (also unlocks audio as a user gesture)
  const el = document.createElement('div'); el.className = 'splash'; el.style.background = '#07090d';
  el.innerHTML = '<div class="press">▶ Tap or press any key</div>'; $('#layer').appendChild(el);
  const go = () => { if (booted) return; booted = true; Sound.unlock(); el.remove(); Input.consume(); window.removeEventListener('keydown', go); G.mode = 'splash'; Splash.run(() => { if (!P.sheet) World.resetSheets(); Opening.run(() => Game.toTitle()); }); };
  el.addEventListener('pointerdown', go); window.addEventListener('keydown', go);
  Boot.go = go;
  requestAnimationFrame(frame);
}
const Boot = { go: null };

let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, last ? (ts - last) / 1000 : STEP); last = ts; acc += dt; Debug.frame(dt);
  let n = 0; while (acc >= STEP && n < 6) { step(STEP); acc -= STEP; n++; } if (n === 6) acc = 0;
  render(); Sound.tick();
}
function step(dt) {
  Input.update(dt); G.time += dt;
  if (G.mode === 'boot') { if (Input.p('A') || Input.p('START')) Boot.go && Boot.go(); }
  else if (G.mode === 'splash') { if (Input.p('A') || Input.p('B')) Splash.padSkip && Splash.padSkip(); }
  else if (UI.stack.length) UI.top().update(dt);
  else if (Fade.busy && Fade.dir > 0) { }
  else if (Dialogue.active) { Dialogue.update(dt); if (Cutscene.active) Cutscene.anim(dt); }
  else if (Puzzle.active) Puzzle.update(dt);
  else if (Brawl.active) Brawl.update(dt);
  else if (G.mode === 'world') { G.play += dt; World.update(dt); }
  else if (G.mode === 'intro') Intro.update(dt);
  else if (Cutscene.active) Cutscene.update(dt);
  if (G.mode === 'world' && !UI.stack.length && !Puzzle.active) World.updateNPCs(Dialogue.active ? 0 : 0);
  if (G.mode === 'title') { P.x = 13 * 16 + 8 + Math.sin(G.time * 0.08) * 110; P.y = 8 * 16 + Math.sin(G.time * 0.05) * 20; World.updateNPCs(dt); }
  Fade.update(dt); HUD.update(dt);
}
function render() { G3.used = false; render0(); G3.sync(); }
function render0() {
  const g = ctx;
  if (Brawl.active && !Puzzle.active && G.mode !== 'boot' && G.mode !== 'splash') { Brawl.render(g); if (Fade.a > 0) { g.fillStyle = `rgba(7,5,10,${Fade.a})`; g.fillRect(0, 0, W, H); } return; }
  if (G.mode === 'boot' || G.mode === 'splash' || !World.map || (Cutscene.active && !$('#card').classList.contains('hidden') && Fade.a >= 1)) { g.fillStyle = '#07090d'; g.fillRect(0, 0, W, H); return; }
  if (Brawl.active && !Puzzle.active) Brawl.render(g);
  else if (Puzzle.active) Puzzle.render(g);
  else if (Cutscene.active && Cutscene.panel) Panels.draw(g, Cutscene.panel);
  else if (Cutscene.active && Cutscene.zoom > 1.02) { // cinematic zoom: render a smaller window, scale it up
    const z = Cutscene.zoom, ow = W, oh = H, zw = Math.round(W / z), zh = Math.round(H / z);
    if (!ZC.c || ZC.c.width !== zw || ZC.c.height !== zh) [ZC.c, ZC.g] = mk(zw, zh);
    W = zw; H = zh; World.render(ZC.g, G.time); W = ow; H = oh;
    g.imageSmoothingEnabled = false; g.drawImage(ZC.c, 0, 0, zw, zh, 0, 0, W, H);
  } else World.render(g, G.time);
  if (Cutscene.active) Cutscene.renderOverlay(g, G.time);
  if (G.mode === 'intro') { g.fillStyle = 'rgba(6,3,5,.82)'; g.fillRect(0, 0, W, H); }
  if (G.mode === 'title') { g.fillStyle = 'rgba(6,3,5,.25)'; g.fillRect(0, 0, W, H); }
  Fade.draw(g);
}
// test/QA hook (harmless in release)
window.BTS = { G, P, World, Puzzle, Dialogue, Game, Save, UI, Input, HUD, Menus, Cutscene, Brawl, Fade, FF, Opening };
boot();
