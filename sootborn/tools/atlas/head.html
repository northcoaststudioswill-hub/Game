<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOOTBORN Asset Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap">
<style>
/* VOICE: a working review board for one game: every asset laid out, each with a place to write what is wrong.
   IDEA: a studio's asset bible: contact sheets by kind, a lightbox, and a red tag on anything with a note.
   PICTURE: the assets themselves, captured from the running build (v0.85).
   COLOUR and TYPE: soot ground, ash text, sun gold for the title, ember for notes, green for "looks good". Cinzel titles, Inter for the work.
   LAYOUT: sticky section bar, responsive grids, a side sheet (bottom sheet on a phone) for the note. */
:root { color-scheme: dark; --bg: #110d0d; --panel: #1b1515; --line: #33282a; --ink: #e8e0d2; --dim: #a39888; --gold: #f2c14e; --ember: #ff6a2a; --ok: #6ccf8a; --q: #8fb4ff; }
* { box-sizing: border-box; min-width: 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; overflow-x: clip; }
header { padding: 28px max(4vw, 16px) 12px; }
h1 { margin: 0; font: 900 clamp(30px, 5vw, 46px)/1.05 Cinzel, Georgia, serif; color: var(--gold); }
.lede { margin: 8px 0 0; color: var(--dim); max-width: 72ch; }
.how { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; }
.how b { color: var(--ink); }
.dbstate { font-size: 13px; color: var(--dim); margin-top: 8px; }
nav { position: sticky; top: 0; z-index: 5; background: rgba(17,13,13,.96); border-bottom: 1px solid var(--line); padding: 10px max(4vw, 16px); display: flex; gap: 8px; overflow-x: auto; align-items: center; }
nav a, nav button, nav input { flex: none; font: 600 14px Inter, sans-serif; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; text-decoration: none; min-height: 40px; }
nav a:hover, nav button:hover { border-color: var(--gold); }
nav button[aria-pressed=true] { background: var(--ember); border-color: var(--ember); color: #1a0d06; }
nav input { width: 170px; font-weight: 400; }
section { padding: 26px max(4vw, 16px) 8px; }
h2 { margin: 0 0 4px; font: 700 26px/1.1 Cinzel, Georgia, serif; color: #fff1d6; }
.sub { margin: 0 0 14px; color: var(--dim); font-size: 14px; max-width: 80ch; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.grid.small { grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; position: relative; text-align: left; color: inherit; font: inherit; padding: 0; }
.card:hover, .card:focus-visible { border-color: var(--gold); outline: none; }
.card .pic { background: #0a0808 repeating-conic-gradient(#151010 0 25%, #0d0a0a 0 50%) 0 0 / 16px 16px; display: grid; place-items: center; aspect-ratio: 16 / 10; overflow: hidden; }
.small .card .pic { aspect-ratio: 1; }
.card img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.card.photo img { object-fit: cover; image-rendering: auto; }
.card .t { padding: 8px 10px 9px; }
.card .t b { display: block; font-size: 14px; }
.card .t span { display: block; font-size: 12.5px; color: var(--dim); overflow-wrap: anywhere; }
.tag { position: absolute; top: 8px; right: 8px; font: 700 12px Inter; padding: 3px 8px; border-radius: 999px; color: #1a0d06; }
.tag.fix { background: var(--ember); } .tag.ok { background: var(--ok); } .tag.q { background: var(--q); }
.pair { display: grid; grid-template-columns: 1fr 64px; }
.pair .bust { background: #0a0808; display: grid; place-items: center; border-left: 1px solid var(--line); }
.pair .bust img { width: 60px; height: auto; image-rendering: pixelated; }
/* modules */
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 18px; font-size: 14px; }
.flow span { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.flow i { color: var(--dim); font-style: normal; }
.mods { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
.mod { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.mod b { color: var(--gold); font-size: 15px; } .mod em { font-style: normal; color: var(--dim); font-size: 13px; margin-left: 6px; }
.mod p { margin: 6px 0 0; font-size: 14px; }
/* sheet */
.sheet { position: fixed; inset: 0 0 0 auto; width: min(560px, 100%); background: #171111; border-left: 1px solid var(--line); z-index: 20; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s; }
.sheet.open { transform: none; }
.shade { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 19; display: none; } .shade.open { display: block; }
.sheet .big { background: #0a0808; flex: 1 1 auto; min-height: 200px; display: grid; place-items: center; overflow: auto; }
.sheet .big img { max-width: 100%; max-height: 52vh; image-rendering: pixelated; }
.sheet .big img.photo { image-rendering: auto; }
.sheet .body { padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
.sheet h3 { margin: 0; font-size: 18px; } .sheet .meta { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { font: 600 14px Inter; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.chips button[aria-pressed=true][data-s=fix] { background: var(--ember); color: #1a0d06; border-color: var(--ember); }
.chips button[aria-pressed=true][data-s=ok] { background: var(--ok); color: #0d1a10; border-color: var(--ok); }
.chips button[aria-pressed=true][data-s=q] { background: var(--q); color: #0d1020; border-color: var(--q); }
textarea { width: 100%; min-height: 110px; font: 16px/1.4 Inter, sans-serif; color: var(--ink); background: #0f0b0b; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
textarea:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.save { font: 700 15px Inter; min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: var(--gold); color: #1a1208; }
.close { font: 600 14px Inter; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
.saved { font-size: 13px; color: var(--dim); }
.notes { display: grid; gap: 8px; }
.note { display: grid; grid-template-columns: 90px 1fr; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; }
.note img { width: 90px; height: 60px; object-fit: contain; background: #0a0808; image-rendering: pixelated; }
.note p { margin: 2px 0 0; white-space: pre-wrap; font-size: 14px; }
.empty { color: var(--dim); font-size: 14px; }
.copy { font: 600 14px Inter; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
footer { padding: 30px max(4vw, 16px) 40px; color: var(--dim); font-size: 13px; }
@media (max-width: 600px) { .sheet { inset: auto 0 0 0; width: 100%; height: 88vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; transform: translateY(100%); } .sheet .big img { max-height: 38vh; } nav input { width: 130px; } }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style></head><body>
