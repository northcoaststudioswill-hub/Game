<title>Sootborn Dev Suite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#eceae4;--panel:#f8f7f3;--panel2:#e3e0d8;--line:#cbc6ba;--text:#1d1a17;--dim:#6a6358;--acc:#a3560f;--acc2:#0f7a74;--bad:#b3261e;--good:#2e7d32;--warn:#8a6100;
  --sel:#f3d9b8;--chip:#ddd8cc;--view:#0b0a10;--shadow:0 1px 0 rgba(0,0,0,.06);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#121116;--panel:#1a1920;--panel2:#24222b;--line:#34313d;--text:#e9e5dc;--dim:#9a9488;--acc:#ffb35a;--acc2:#4fd6d0;--bad:#ff6b5e;--good:#7bd389;--warn:#e7c35a;
    --sel:#3a2c1c;--chip:#2c2a33;--view:#07070b;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#121116;--panel:#1a1920;--panel2:#24222b;--line:#34313d;--text:#e9e5dc;--dim:#9a9488;--acc:#ffb35a;--acc2:#4fd6d0;--bad:#ff6b5e;--good:#7bd389;--warn:#e7c35a;
  --sel:#3a2c1c;--chip:#2c2a33;--view:#07070b;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer;min-height:26px;white-space:nowrap}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.on,button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button.pri{background:var(--acc2);color:var(--bg);border-color:var(--acc2)}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 6px;min-height:26px;min-width:0}
input[type=number]{width:74px;font-family:var(--mono);font-size:12px}
input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;vertical-align:middle}
input[type=range]{vertical-align:middle;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);vertical-align:middle}
textarea{width:100%;font-family:var(--mono);font-size:11.5px;min-height:90px;resize:vertical}
label{white-space:nowrap}
code,.mono{font-family:var(--mono);font-size:12px}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;font-weight:600}
h3:first-child{margin-top:4px}
details>summary{cursor:pointer;padding:3px 0;font-weight:500;list-style-position:inside}
details>summary .n{color:var(--dim);font-weight:400;font-family:var(--mono);font-size:11px}
.dim{color:var(--dim)} .bad{color:var(--bad)} .good{color:var(--good)} .warn{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.row.tight{gap:4px}
.grow{flex:1 1 auto;min-width:0}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:0 8px;font-size:11px;font-family:var(--mono);line-height:18px;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-family:var(--mono);font-size:12px}
.kv>:nth-child(odd){color:var(--dim)}
.list{border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:320px;overflow:auto}
.list .it{display:flex;gap:6px;align-items:center;padding:3px 7px;border-bottom:1px solid var(--line);cursor:pointer;min-height:26px}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:var(--panel2)}
.list .it.sel{background:var(--sel)}
.list .it .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .m{color:var(--dim);font-family:var(--mono);font-size:11px;white-space:nowrap}
.btnlist{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.btnlist button{white-space:normal;text-align:left;max-width:100%;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;box-shadow:var(--shadow)}
.empty{color:var(--dim);font-style:italic;padding:6px 0}

/* ---- header ---- */
#top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 6px;padding-top:max(8px, env(safe-area-inset-top,0px))}
#top .brand{font-weight:600;letter-spacing:.02em;font-size:14px;white-space:nowrap}
#top .brand b{color:var(--acc);font-weight:600}
#sync{display:inline-flex;align-items:center;gap:6px}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
#sync.db i{background:var(--good)} #sync.local i{background:var(--warn)} #sync.err i{background:var(--bad)} #sync.loading i{background:var(--acc2)}
#top .sp{flex:1 1 auto}

/* ---- layout ---- */
#app{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:12px;align-items:start}
#viewCol{position:sticky;top:6px;min-width:0}
#viewBar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
#viewBar .status{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{position:relative;background:var(--view);border-radius:8px;overflow:hidden;aspect-ratio:16/9;width:100%;max-height:calc(100vh - 140px);border:1px solid var(--line)}
#view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#07090d}
#view .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfc8bb;font-family:var(--mono);font-size:12px;text-align:center;padding:16px;pointer-events:none}
#view.pick{outline:2px solid var(--acc2);outline-offset:-2px}
#viewHint{font-size:11.5px;color:var(--dim);margin-top:4px;min-height:16px}
#panelCol{min-width:0}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);margin-bottom:8px}
#tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 9px;color:var(--dim);font-weight:500}
#tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--acc)}
#tabs button .b{display:inline-block;min-width:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;margin-left:4px;padding:0 4px;font-family:var(--mono)}
.panel{display:none}
.panel.on{display:block}
#ws{position:relative;background:var(--view);border-radius:8px;overflow:hidden;aspect-ratio:4/3;max-height:360px;width:100%;border:1px solid var(--line);margin-bottom:6px;display:none}
#ws.on{display:block}
#ws iframe,#ws canvas.c2d{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#ws canvas.c2d{image-rendering:pixelated;background:#1a1416}
#ws .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfc8bb;font-family:var(--mono);font-size:12px;pointer-events:none;text-align:center;padding:12px}
#ws .tag{position:absolute;left:8px;top:6px;color:#e9e5dc;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:4px;pointer-events:none}
#wsBar{display:none;margin-bottom:6px}
#wsBar.on{display:flex}

/* fields */
.fields{display:grid;grid-template-columns:minmax(80px,max-content) 1fr;gap:4px 10px;align-items:center}
.fields>.l{color:var(--dim);font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.fields>.l.ch{color:var(--acc);font-weight:600}
.fields .v{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.fields .v .mono{color:var(--dim)}
.log{font-family:var(--mono);font-size:11px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 0}
.log div{padding:1px 7px;white-space:pre-wrap;word-break:break-word;border-bottom:1px dotted var(--line)}
.log div:last-child{border-bottom:0}
.log .error{color:var(--bad)} .log .warn{color:var(--warn)} .log .ev{color:var(--acc2)}
.log time{color:var(--dim);margin-right:6px}
.tree{font-family:var(--mono);font-size:12px}
.tree .it{padding-left:calc(7px + var(--d,0) * 14px)}
.nudge{display:grid;grid-template-columns:repeat(6,auto);gap:3px;justify-content:start}
.nudge button{min-width:40px;font-family:var(--mono);font-size:11px;padding:2px 4px}
#mapWrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:auto;background:#0d0a0c;max-height:420px;touch-action:none}
#mapWrap canvas{display:block;image-rendering:pixelated;touch-action:none}
.confirm{display:inline-flex;gap:6px;align-items:center;background:var(--sel);border-radius:6px;padding:2px 6px}
.note{border-left:3px solid var(--acc2);padding:4px 8px;margin:6px 0;background:var(--panel)}
.note p{margin:0 0 2px;white-space:pre-wrap;word-break:break-word}
.ovr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 8px;border-bottom:1px solid var(--line)}
.ovr:last-child{border-bottom:0}
.ovr .lb{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ovr .meta{grid-column:1/2;color:var(--dim);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovr .act{grid-row:1/3;grid-column:2/3;align-self:center;display:flex;gap:4px}
.ovr.stale .lb::after{content:' · not found in this build';color:var(--warn);font-weight:400;font-size:11px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 3px;color:var(--dim)}

@media (max-width: 899px){
  #app{grid-template-columns:minmax(0,1fr)}
  #viewCol{position:static}
  #view{max-height:none}
  #tabs{position:sticky;top:0;background:var(--bg);z-index:5}
  .list{max-height:260px}
}
@media (max-width: 480px){
  #top .brand{font-size:13px}
  .fields{grid-template-columns:minmax(64px,max-content) 1fr}
  input[type=number]{width:64px}
}
</style>

<header id="top">
  <span class="brand">SOOTBORN <b>Dev Suite</b></span>
  <span class="chip" id="verChip" title="The game build loaded in this suite (GAME_VER)">game v…</span>
  <span class="chip" id="sync" title="Where your changes go"><i></i><span id="syncText">Starting…</span></span>
  <span class="sp"></span>
  <button id="btnTheme" title="Theme: follow the system, light, or dark">Theme: auto</button>
  <button id="btnReload" title="Reload the game build (keeps your overrides)">Reload game</button>
</header>

<div id="app">
  <section id="viewCol" aria-label="Live game">
    <div id="viewBar">
      <span class="status" id="viewStatus">loading…</span>
      <button id="btnPause" title="Pause the game (Alt+P)">Pause</button>
      <button id="btnStep" title="Advance one frame while paused (Alt+.)">Step</button>
      <select id="selSpeed" title="Time scale" aria-label="Time scale">
        <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option>
      </select>
      <button id="btnGod" title="God mode: health stays full (Alt+G)">God</button>
      <button id="btnTitle" title="Stop what is playing and go to the title">Title</button>
    </div>
    <div id="view"><iframe id="game" title="SOOTBORN game build" allow="autoplay; gamepad; fullscreen"></iframe><div class="msg" id="viewMsg">Loading game.html…</div></div>
    <div id="viewHint">Click the game to give it the keyboard. Alt+1…7 switch panels.</div>
  </section>

  <section id="panelCol" aria-label="Tools">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="play" aria-selected="true">Play</button>
      <button role="tab" data-tab="chars">Characters</button>
      <button role="tab" data-tab="anim">Animations</button>
      <button role="tab" data-tab="bones">Bones</button>
      <button role="tab" data-tab="areas">Areas</button>
      <button role="tab" data-tab="insp">Inspector</button>
      <button role="tab" data-tab="ovr">Overrides <span class="b" id="ovCount" hidden>0</span></button>
    </nav>

    <div id="wsBar" class="row tight">
      <select id="wsSource" aria-label="Which characters">
        <option value="rig">Comic rig (3D levels)</option>
        <option value="cast">Cast (2D, 2.5D, 3D fights)</option>
      </select>
      <select id="wsLevel" aria-label="Comic level the rig is dressed for" title="The rig is dressed differently in each comic level"></select>
      <select id="wsChar" class="grow" aria-label="Character"></select>
      <button id="wsTurn" aria-pressed="true" title="Turntable">Turn</button>
    </div>
    <div id="ws"><span class="tag" id="wsTag"></span><div class="msg" id="wsMsg">The preview starts when the game has loaded.</div></div>

    <div class="panel on" data-panel="play" role="tabpanel">
      <h3>Jump</h3>
      <div class="row"><input type="search" id="jumpFind" class="grow" placeholder="Filter fights, levels, scenes…  ( / )" aria-label="Filter"></div>
      <div id="jumpLists"><div class="empty">Waiting for the game…</div></div>
      <h3>Switches</h3>
      <div class="row">
        <label>Difficulty <select id="selDiff"><option value="0">Story</option><option value="1">Hard</option><option value="2">Brutal</option></select></label>
        <label><input type="checkbox" id="chkQuick"> Skip fight intro films</label>
        <label><input type="checkbox" id="chkFury"> Fights start at full fury</label>
        <label><input type="checkbox" id="chkNoff"> Skip opening films (#noff, on reload)</label>
      </div>
      <h3>Event and error log</h3>
      <div class="row">
        <select id="logFilter" aria-label="Log filter"><option value="all">Everything</option><option value="ev">Events</option><option value="error">Errors and warnings</option></select>
        <button id="logClear">Clear</button>
        <span class="dim" id="logInfo"></span>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
    </div>

    <div class="panel" data-panel="chars" role="tabpanel">
      <div id="charInfo" class="dim"></div>
      <div id="charFields"></div>
    </div>

    <div class="panel" data-panel="anim" role="tabpanel">
      <div class="row">
        <button id="anPlay" aria-pressed="true">Pause</button>
        <button id="anBack" title="One frame back">◂ frame</button>
        <button id="anFwd" title="One frame on">frame ▸</button>
        <label>Speed <input type="range" id="anSpeed" min="0" max="3" step="0.05" value="1"> <span class="mono" id="anSpeedV">1.00×</span></label>
      </div>
      <div class="row"><label class="grow">Time <input type="range" id="anScrub" min="0" max="1" step="0.001" value="0" style="width:70%"></label><span class="mono" id="anTime">0.00 s</span></div>
      <div class="row" id="anOpts"></div>
      <div id="anLists"></div>
    </div>

    <div class="panel" data-panel="bones" role="tabpanel">
      <div class="row"><label><input type="checkbox" id="bnShow" checked> Draw the skeleton on the preview</label><label><input type="checkbox" id="bnHand"> Pose by hand (stops the animation)</label></div>
      <div id="bnBody"></div>
    </div>

    <div class="panel" data-panel="areas" role="tabpanel">
      <div id="areasBody"></div>
    </div>

    <div class="panel" data-panel="insp" role="tabpanel">
      <div id="inspBody"></div>
    </div>

    <div class="panel" data-panel="ovr" role="tabpanel">
      <div id="ovrBody"></div>
    </div>
  </section>
</div>
<script>
'use strict';
/* =====================================================================================================
   SOOTBORN Dev Suite.
   The game build (game.html, a supporting file beside this page) runs in a same-origin srcdoc frame.
   The suite reaches into it (and into the comic-book level frame the game makes) to jump, inspect and edit.
   Every edit is an OVERRIDE: a small patch kept in the artifact's shared database (collection `overrides`),
   re-applied to the running game live and on every load or level change, and baked into source by Claude.
   See devsuite/README.md.
   ===================================================================================================== */
const SUITE_VER = '1.0';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function h(tag, p, ...kids) {
  const e = document.createElement(tag);
  if (p) for (const k in p) {
    const v = p[k]; if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'style') e.style.cssText = v;
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
    else e.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids.flat(3)) { if (c === null || c === undefined || c === false) continue; e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); }
  return e;
}
const clear = e => { while (e.firstChild) e.removeChild(e.firstChild); return e; };
const fmt = (v, d) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d === undefined ? 2 : d) : String(v);
const r3 = v => Math.round(v * 1000) / 1000;
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const hex6 = n => '#' + ('000000' + ((n >>> 0) & 0xffffff).toString(16)).slice(-6);
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
const ago = t => { if (!t) return ''; const s = Math.max(0, (Date.now() - t) / 1000); return s < 50 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 * 2 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' days ago'; };
const Pref = {   // conveniences only (tab, theme, toggles); every read and write may fail and that is fine
  get(k, d) { try { const v = localStorage.getItem('sbds_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sbds_' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
};
// a db path segment: letters, digits and _ - . ~ : @ + only
const seg = s => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g, '-').slice(0, 120) || '-';

/* ------------------------------------------------------------------ log */
const Log = {
  items: [], max: 500, errors: 0, dirty: false,
  add(src, level, msg) {
    msg = String(msg === undefined ? '' : msg).slice(0, 700);
    const last = this.items[this.items.length - 1];
    if (last && last.msg === msg && last.src === src && last.level === level) { last.n = (last.n || 1) + 1; last.t = Date.now(); }
    else { this.items.push({ t: Date.now(), src, level, msg }); if (this.items.length > this.max) this.items.shift(); }
    if (level === 'error') this.errors++;
    this.dirty = true;
  },
  render() {
    if (!this.dirty) return; this.dirty = false;
    const box = $('#log'), f = $('#logFilter').value, atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
    clear(box);
    const list = this.items.filter(it => f === 'all' || (f === 'error' ? (it.level === 'error' || it.level === 'warn') : it.level === 'ev')).slice(-250);
    for (const it of list) {
      const d = new Date(it.t), ts = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
      box.appendChild(h('div', { class: it.level }, h('time', { text: ts }), '[' + it.src + '] ' + it.msg + (it.n > 1 ? '  ×' + it.n : '')));
    }
    if (!list.length) box.appendChild(h('div', { class: 'dim', text: 'Nothing yet.' }));
    if (atEnd) box.scrollTop = box.scrollHeight;
    $('#logInfo').textContent = this.errors ? this.errors + ' error' + (this.errors > 1 ? 's' : '') + ' so far' : 'no errors';
  }
};
window.__DEVLOG = (src, level, msg) => Log.add(src, level, msg);
window.addEventListener('error', e => Log.add('suite', 'error', (e.message || 'error') + (e.lineno ? ' @' + e.lineno + ':' + e.colno : '')));
window.addEventListener('unhandledrejection', e => Log.add('suite', 'error', 'unhandled: ' + ((e.reason && (e.reason.message || e.reason.code)) || e.reason)));

/* ------------------------------------------------------------------ untrusted data from the db */
// Overrides are written by viewers. Everything read back is checked: known kinds, plain JSON values, safe keys.
const KEY_OK = /^[A-Za-z0-9_]{1,40}$/;
function cleanVal(v, depth) {
  if (v === null) return null;
  if (typeof v === 'number') return isFinite(v) ? v : undefined;
  if (typeof v === 'boolean') return v;
