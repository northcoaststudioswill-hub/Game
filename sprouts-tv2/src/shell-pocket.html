<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sprouts</title>
<style>
/* Sprouts Pocket: the same game as Sprouts TV 2, built for a phone held upright. A screen, a pad, five buttons. */
:root{--page:#15121d;--shell:#58a848;--shell-lo:#3c8038;--shell-hi:#8cd070;--bezel:#2a2238;--btn:#3a3050;--btn-lo:#231c33;--berry:#e23b5e;--berry-lo:#9c1f3c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--page);display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
.pocket{width:100%;max-width:440px;height:100%;max-height:900px;display:flex;flex-direction:column;border-radius:20px 20px 48px 48px;touch-action:none;
  background:linear-gradient(180deg,var(--shell-hi) 0,var(--shell) 5%,var(--shell) 84%,var(--shell-lo) 100%);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.35)}
.bezel{flex:1;min-height:0;display:flex;flex-direction:column;margin:10px 8px 0;padding:8px 8px 3px;background:var(--bezel);border-radius:10px 10px 24px 24px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.scr{flex:1;min-height:0;position:relative}
canvas#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0c0a12;border-radius:3px;image-rendering:pixelated}
.brand{flex:none;display:flex;justify-content:space-between;color:#8f86a8;font-size:10px;letter-spacing:.06em;padding:3px 6px 1px}
.controls{--s:min(45vw,188px,25vh);flex:none;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;row-gap:10px;padding:12px 10px 30px}
.dpad{width:var(--s);height:var(--s);position:relative;border-radius:50%;background:rgba(0,0,0,.08);touch-action:none}
.dpad i{position:absolute;background:var(--btn);border-radius:8px;box-shadow:0 4px 0 var(--btn-lo);transform:translate(calc(var(--tx,0)*2px),calc(var(--ty,0)*2px))}
.dpad i:nth-child(1){left:5%;right:5%;top:33.5%;height:33%}
.dpad i:nth-child(2){top:5%;bottom:5%;left:33.5%;width:33%}
.dpad b{position:absolute;left:42%;top:42%;width:16%;height:16%;border-radius:50%;background:var(--btn-lo);transform:translate(calc(var(--tx,0)*2px),calc(var(--ty,0)*2px))}
.ab{width:var(--s);height:calc(var(--s)*.8);position:relative}
.rnd{position:absolute;width:47%;aspect-ratio:1;border-radius:50%;border:0;padding:0;font:700 24px/1 ui-monospace,monospace;touch-action:none}
.rnd span{display:block;font-size:11px;font-weight:500;margin-top:2px;opacity:.9}
#bA{right:0;top:0;background:var(--berry);color:#fff;box-shadow:0 5px 0 var(--berry-lo)}
#bB{left:0;bottom:0;background:var(--btn);color:#f6e9c9;box-shadow:0 5px 0 var(--btn-lo)}
.rnd.on{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-lo) !important}
.meta{grid-column:1/3;display:flex;justify-content:center;gap:12px}
.pill{border:0;background:var(--btn);color:#f6e9c9;border-radius:99px;padding:9px 14px;font:500 13px/1 ui-monospace,monospace;box-shadow:0 3px 0 var(--btn-lo);touch-action:none;min-width:88px}
.pill.on{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-lo)}
.pill small{font-size:10px;opacity:.7;margin-left:4px}
@media (max-width:440px){.pocket{border-radius:0 0 36px 36px;max-height:none}}
</style>
</head>
<body>
<div class="pocket">
  <div class="bezel">
    <div class="scr"><canvas id="screen" width="480" height="400" aria-label="Sprouts"></canvas></div>
    <div class="brand"><span>Sprouts</span><span>North Coast Studios</span></div>
  </div>
  <div class="controls">
    <div class="dpad" id="dpad" aria-label="Direction pad"><i></i><i></i><b></b></div>
    <div class="ab">
      <button class="rnd" id="bA" aria-label="A: act, throw, pluck, talk">A<span>act</span></button>
      <button class="rnd" id="bB" aria-label="B: back, call sprouts">B<span>call</span></button>
    </div>
    <div class="meta">
      <button class="pill" id="bSel">Select<small>swap</small></button>
      <button class="pill" id="bY">Photo</button>
      <button class="pill" id="bSta">Start<small>pause</small></button>
    </div>
  </div>
</div>
<script>
/* Sprouts Pocket and Sprouts TV 2 are one game, so they share one save name. The untouched reader is kept as __rawGet
   so IMPORT A SAVE can look (read only) at a Sprouts TV or Pocket Lantern save in the same browser. */
(()=>{try{const P='sprouts-tv2:',S=Storage.prototype,g=S.getItem,st=S.setItem,rm=S.removeItem;window.__rawGet=k=>{try{return g.call(localStorage,k)}catch(e){return null}};
S.getItem=function(k){return g.call(this,P+k)};S.setItem=function(k,v){return st.call(this,P+k,v)};
S.removeItem=function(k){return rm.call(this,P+k)}}catch(e){}})();
</script>
<script>/*@MUSIC tracks*/</script>
<script>/*@MUSIC pp*/</script>
<script>/*game.js*/</script>
</body>
</html>
