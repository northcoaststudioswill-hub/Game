(function(){
// PITBORN 2145 — data: everything a designer would want to edit lives here.
'use strict';
const VERSION = '0.1';

// ---------- attributes ----------
// cat: F finishing, S shooting, P playmaking, D defense, A athletics
const ATTRS = [
  { id: 'layup', n: 'Layup', cat: 'F', d: 'Finishing at the rim without leaving your dignity up there.' },

  { id: 'perd', n: 'Perimeter D', cat: 'D', d: 'Stay in front, contest jumpers, keep your ankles.' },
  { id: 'intd', n: 'Interior D', cat: 'D', d: 'Contests at the rim.' },

  { id: 'block', n: 'Block', cat: 'D', d: 'Return shots to sender.' },

  { id: 'stam', n: 'Stamina', cat: 'A', d: 'Sprint and chain moves longer before your shot falls apart.' },
];
const ATTR = {}; ATTRS.forEach(a => ATTR[a.id] = a);
const CATS = { F: ['FINISHING', '#ff5a3c'], S: ['SHOOTING', '#3cd070'], P: ['PLAYMAKING', '#ffc531'], D: ['DEFENSE', '#3ca0ff'], A: ['ATHLETICS', '#c66bff'] };

// ---------- playstyles (the "class") : base caps before body mods ----------
const STYLES = [
  { id: 'sniper', n: 'Sniper', tag: 'Certified from the parking lot.',

  { id: 'slasher', n: 'Slasher', tag: 'The lane is a constitutional right.',
    cap: { layup: 99, dunk: 99, close: 90, mid: 80, three: 72, iq: 78, handle: 88, pass: 76, swb: 92, perd: 80, intd: 66, steal: 78, block: 66, reb: 66, speed: 95, accel: 97, str: 78, vert: 99, stam: 94 } },
  { id: 'general', n: 'Floor General', tag: 'Everybody eats. You hold the menu.',
    cap: { layup: 86, dunk: 66, close: 82, mid: 88, three: 88, iq: 92, handle: 99, pass: 99, swb: 97, perd: 84, intd: 50, steal: 86, block: 45, reb: 52, speed: 92, accel: 95, str: 58, vert: 72, stam: 97 } },
  { id: 'lockdown', n: 'Lockdown', tag: 'Your matchup files a complaint.',

  { id: 'glass', n: 'Glass Eater', tag: 'Every rebound is a personal asset.',

  { id: 'showman', n: 'Showman', tag: 'Efficiency is for accountants.',

  { id: 'mallrat', n: 'Mall Rat', d: 'Raised in the last open food court in Ohio.', perk: 'Shops charge 10% less VC.', k: 'shop', v: 0.10 },

  { id: 'rustbelt', n: 'Rust Belt Kid', d: 'Learned the game on a rim welded to a silo.', perk: '+15% Respect from every game.', k: 'rep', v: 0.15 },

  layup: [-2, -2, 2], dunk: [5, -2, 4], close: [5, 3, 2], mid: [-3, 0, -3], three: [-7, -1, -4], iq: [-2, 0, 0],
  handle: [-11, -3, -3], pass: [-3, 0, 0], swb: [-10, -5, -1], perd: [-6, -3, 4], intd: [11, 5, 5], steal: [-5, -2, 7],
  block: [13, 0, 8], reb: [11, 4, 6], speed: [-10, -7, 0], accel: [-11, -8, 0], str: [8, 13, 0], vert: [-5, -8, 0], stam: [-2, -5, 0],

function fmtH(i) { return Math.floor(i / 12) + "'" + (i % 12) + '"'; }
function bodyNorm(b) { return { h: (b.h - 77) / 10, w: b.w, s: b.s }; }   // w, s stored as -1..1 sliders
function capsFor(build) {
  const st = STYLE[build.style], bn = bodyNorm(build.body), o = ORIGIN[build.origin], out = {};

    if (o.k === 'ath' && a.cat === 'A') c += o.v;
    if (o.k === 'orb') { if (a.id === 'vert') c += 4; if (a.id === 'three') c += 2; }

function startAttrs(build) { const c = capsFor(build), o = {}; for (const a of ATTRS) o[a.id] = Math.max(30, Math.round(c[a.id] * 0.60)); return o; }
function attrCost(v) { return Math.round(6 + Math.pow(Math.max(0, v - 30), 1.55) * 0.16); }   // VC for +1 from v
const OVR_W = { layup: 1, dunk: .7, close: .7, mid: 1, three: 1.2, iq: .8, handle: 1.1, pass: .8, swb: .8, perd: 1, intd: .7, steal: .8, block: .7, reb: .8, speed: 1, accel: 1, str: .6, vert: .7, stam: .6 };
function ovrOf(attrs) {
  // best 12 weighted, so specialists are not punished for dump stats
  const v = ATTRS.map(a => attrs[a.id]).sort((a, b) => b - a).slice(0, 12);
  return Math.min(99, Math.round(v.reduce((s, x) => s + x, 0) / 12 + 2));
}

function worldStep(dt) {
  if (!W) return; W.t += dt; const me = W.me, I = IN[0], busy = uiBusy();
  let mx = busy ? 0 : I.mx, my = busy ? 0 : I.my;
  if (!busy) W.yaw -= (I.rx * 2.4 + mx * 0.9 * Math.min(1, Math.abs(my) + 0.4)) * dt;
  // camera looks along (sin yaw, cos yaw)
  const fx = Math.sin(W.yaw), fz = Math.cos(W.yaw), rx = -fz, rz = fx;
  const sp = (I.sprint ? 7.5 : 4.6) * (W.kind === 'hub' ? 1.15 : 1);
  const tvx = (fx * -my + rx * mx) * sp, tvz = (fz * -my + rz * mx) * sp;
  me.vx += (tvx - me.vx) * Math.min(1, 12 * dt); me.vz += (tvz - me.vz) * Math.min(1, 12 * dt);
  let nx = me.x + me.vx * dt, nz = me.z + me.vz * dt;
  for (const s of W.solids) { if (nx > s[0] && nx < s[1] && nz > s[2] && nz < s[3]) { const px = Math.min(nx - s[0], s[1] - nx), pz = Math.min(nz - s[2], s[3] - nz); if (px < pz) nx = nx - s[0] < s[1] - nx ? s[0] : s[1]; else nz = nz - s[2] < s[3] - nz ? s[2] : s[3]; } }
  me.x = clamp(nx, W.bounds[0], W.bounds[1]); me.z = clamp(nz, W.bounds[2], W.bounds[3]);
  const v = Math.hypot(me.vx, me.vz); if (v > 0.5) me.face = lerpAng(me.face, Math.atan2(me.vx, me.vz), 1 - Math.exp(-12 * dt));
  me.ph += dt * (4 + v * 1.6);
  const R = me.rig; applyPose(R, poseOf(v > 0.5 ? 'run' : 'idle', v > 0.5 ? 0 : W.t, { sp: v / 8, ph: me.ph }), dt); R.root.position.set(me.x, 0, me.z); R.root.rotation.y = me.face; R.capeSwing = v / 8;
  // npcs
  for (const n of W.npcs) {
    let an = n.anim, o = { ph: n.ph, leg: n.rig.legLen };
    if (n.wander && !(n.bum && W.talk === n)) {
      n.wt -= dt; if (n.wt <= 0) { n.wt = rnd(3, 9); n.tx = n.hx + rnd(-2.5, 2.5); n.tz = n.hz + rnd(-2.5, 2.5); }
      const dx = n.tx - n.x, dz = n.tz - n.z, l = Math.hypot(dx, dz);
      if (l > 0.3) { n.x += dx / l * 1.1 * dt; n.z += dz / l * 1.1 * dt; n.face = lerpAng(n.face, Math.atan2(dx, dz), 0.1); n.ph += dt * 5.5; an = 'walk'; o = { sp: 0.12, ph: n.ph }; if (n.spot) { n.spot.x = n.x; n.spot.z = n.z; } }
      else if (Math.hypot(me.x - n.x, me.z - n.z) < 5 && n.bum) n.face = lerpAng(n.face, Math.atan2(me.x - n.x, me.z - n.z), 0.08);
    }
    n.rig.root.position.set(n.x, 0, n.z); n.rig.root.rotation.y = n.face; applyPose(n.rig, poseOf(an, W.t, o), dt);
  }
  for (const c of W.cars) { c.a += c.s * dt; c.c.position.set(Math.cos(c.a) * c.r, c.y, Math.sin(c.a) * c.r); c.c.rotation.y = -c.a + (c.s > 0 ? -Math.PI / 2 : Math.PI / 2); }
  if (W.flag) { const pa = W.flag.geometry.attributes.position; for (let i = 0; i < pa.count; i++) pa.setZ(i, Math.sin(pa.getX(i) * 1.2 + W.t * 3) * 0.25 * (pa.getX(i) / 3 + 1)); pa.needsUpdate = true; }
  // nearest interactable
  let near = null, nd = 99; for (const s of W.spots) { const d = Math.hypot(s.x - me.x, s.z - me.z); if (d < s.r && d < nd) { nd = d; near = s; } }
  if (near !== W.near) { W.near = near; const p = $('prompt'); if (near) { p.textContent = near.label; p.style.display = 'block'; } else p.style.display = 'none'; }
  if (busy) $('prompt').style.display = 'none'; else if (W.near) $('prompt').style.display = 'block';
  if (!busy && W.near && I.aP) { sfx('uiok'); W.near.fn(); }
  else if (!busy && I.start) uiPlayer('attrs');
  // camera
  const portrait = innerWidth < innerHeight, back = portrait ? 7.5 : 6.2, up = portrait ? 3.8 : 3.1;
  let cx = me.x - fx * back, cz = me.z - fz * back;
  if (W.kind !== 'hub') { cx = clamp(cx, W.bounds[0] - (W.kind === 'crib' ? 6 : 0.3), W.bounds[1] + (W.kind === 'crib' ? 6 : 0.3)); cz = clamp(cz, W.bounds[2] - (W.kind === 'crib' ? 1 : 0.3), W.bounds[3] + (W.kind === 'crib' ? 6 : 0.4)); }
  if (W.look) {   // shop / closet: swing round to look at your drip
    const mfx = Math.sin(me.face), mfz = Math.cos(me.face), sx = -mfz, sz = mfx;
    if (portrait) { _v.set(me.x + mfx * 5.6, 0.6, me.z + mfz * 5.6); camera.position.lerp(_v, 1 - Math.exp(-6 * dt)); camera.lookAt(me.x, -0.6, me.z); }
    else { _v.set(me.x + mfx * 4.2 + sx * 1.6, 1.3, me.z + mfz * 4.2 + sz * 1.6); camera.position.lerp(_v, 1 - Math.exp(-6 * dt)); camera.lookAt(me.x + sx * 1.6, 1.0, me.z + sz * 1.6); }
    return;
  }
  _v.set(cx, up, cz); if (!W.camInit) { camera.position.copy(_v); W.camInit = true; } else camera.position.lerp(_v, 1 - Math.exp(-7 * dt));
  camera.lookAt(me.x + fx * 2, 1.7, me.z + fz * 2);
}

function achVal(k) {
  if (k === 'owned') return S.owned.length; if (k === 'cribs') { let n = 0; for (const c in S.crib) n += S.crib[c]; return n; }
  if (k === 'ovr') return S.attrs.layup ? ovrOf(S.attrs) : 0; if (k === 'homies') return Math.max(S.life.homies || 0, S.homies.length);
  return S.life[k] || 0;
}
function checkAch() {
  for (const a of ACH) {
    if (S.ach[a.id] || achVal(a.k) < a.t) continue; S.ach[a.id] = 1; S.vc += a.vc;
    if (a.drip && !S.owned.includes(a.drip)) S.owned.push(a.drip);

  }
  save(); uiHud();
}
function gainRep(v) {
  S.rep += Math.round(v); const r = rankOf(S.rep);
  if (r > S.seenRank) {
    S.seenRank = r; const n = DRIP.filter(d => d.rank === r && d.src === 'shop').length + MOVES.concat(JUMPERS, DUNKS, CELEBS).filter(m => m.rank === r).length;
    const ct = TIERS_COURT.find(t => t.rank === r);
    setTimeout(() => { toast('RANK UP: ' + RANKS[r].n, (ct ? 'New court: ' + ct.n + ' · ' : '') + n + ' new things in the shops', 'rank'); sfx('rank'); }, 900);
  }
  uiHud();
}

function launchGame(m, tier, st) {
  const mk = (o, lvl) => { const b = aiBuild(clamp(o + rnd(-3, 3), 50, 99)); return { b, ctrl: -1, ai: lvl }; };
  const used = new Set(); const nm = sp => { let n = sp.b.name, k = 0; while (used.has(n) || n === S.name) n = pick(NPC_NAMES) + (++k > 20 ? k : ''); used.add(n); sp.b.name = n; return sp; };
  const t0 = [{ b: myBuild(), ctrl: 0, mine: true }];
  for (let i = 0; i < m.size - 1; i++) {
    const hi = st.mates[i] === undefined ? -1 : st.mates[i];
    const sp = hi >= 0 && S.homies[hi] ? { b: JSON.parse(JSON.stringify(S.homies[hi])), ctrl: -1, ai: Math.max(0.5, tier.ai) } : nm(mk(tier.ovr - 2, Math.max(0.35, tier.ai * 0.9)));
    if (i === 0 && st.p2 === 'coop') sp.ctrl = 1; t0.push(sp);
  }
  const t1 = [];
  for (let i = 0; i < m.size; i++) {
    const sp = i === 0 && st.rival >= 0 && S.homies[st.rival] ? { b: JSON.parse(JSON.stringify(S.homies[st.rival])), ctrl: -1, ai: Math.max(0.5, tier.ai) } : nm(mk(tier.ovr, tier.ai));
    if (i === 0 && st.p2 === 'vs') sp.ctrl = 1; t1.push(sp);
  }
  twoPlayer = st.p2 !== 'off';
  const boosts = S.boosts.slice(); S.boosts = []; save();
  const cfg = { mode: m, tier, teams: [t0, t1], boosts, ball: S.worn.ball, seed: Math.floor(Math.random() * 8), firstOff: Math.random() < 0.6 ? 0 : 1, p2: st.p2 };
  cfg.onEnd = res => finishGame(res, m, tier, st, cfg);
  uiClose(); document.body.dataset.state = 'match'; startMatch(cfg); uiHud();
}
function finishGame(res, m, tier, st, cfg) {
  twoPlayer = false; const doorX = -10.5 + MODES.indexOf(m) * 7;
  enterWorld('pit', doorX, -6.6, 0);
  if (res.quit) { toast('FORFEIT', 'No VC. No Respect. The park saw that.'); return; }
  const s = res.stats, L = S.life, notes = [];
  let vc = (res.win ? 70 : 30) * tier.mult + s.pts * 4 + s.ast * 6 + s.reb * 4 + s.stl * 8 + s.blk * 8 + s.ankles * 10 + s.dunks * 5 + s.greens * 4;
  if (m.arcade) vc *= 0.75;       // JAM games are faster and score more
  const cv = cribFx('vc'); if (cv) { vc *= 1 + cv; notes.push(`Trophy wall +${Math.round(cv * 100)}% VC`); }
  if (cfg.boosts.includes('lotto')) { if (Math.random() < 0.5) { vc *= 2; notes.push('SCRATCH-OFF HIT: VC doubled'); } else notes.push('Scratch-off: "PLAY AGAIN"'); }
  let rep = (res.win ? 45 : 12) * tier.mult + s.pts + s.ast * 2 + s.stl * 2 + s.blk * 2 + s.ankles * 3 + res.bonusRep;
  const rm = (ORIGIN[S.build.origin].k === 'rep' ? 0.15 : 0) + cribFx('rep'); if (rm) { rep *= 1 + rm; notes.push(`+${Math.round(rm * 100)}% Respect`); }
  if (res.shutout && res.win) { rep += 40; notes.push('SKUNK: +40 Respect'); }
  vc = Math.round(vc); rep = Math.round(rep);
  const bx = { F: 12 + s.dunks * 20 + (s.fgm - s.threes) * 7, S: 12 + s.greens * 12 + s.threes * 14, P: 12 + s.ast * 22 + s.ankles * 24, D: 12 + s.stl * 24 + s.blk * 24 + s.reb * 9 };
  const mS = 1 + cribFx('bxS') + cribFx('bxSF'), mF = 1 + cribFx('bxSF'); bx.S = Math.round(bx.S * mS); bx.F = Math.round(bx.F * mF);
  const pts = [];
  for (const c in bx) { bx[c] = Math.round(bx[c] * (res.win ? 1 : 0.7) * (0.8 + tier.mult * 0.2)); S.bxp[c] += bx[c]; let n = 0; while (S.bxp[c] >= 100) { S.bxp[c] -= 100; S.bp[c]++; n++; } if (n) pts.push(`+${n} ${CATS[c][0]} badge point${n > 1 ? 's' : ''}`); }
  S.vc += vc;
  for (const k of ['pts', 'ast', 'reb', 'stl', 'blk', 'ankles', 'greens', 'dunks', 'threes', 'bravs', 'fires']) L[k] = (L[k] || 0) + s[k];
  L.games = (L.games || 0) + 1; if (res.win) L.wins = (L.wins || 0) + 1; if (res.shutout && res.win) L.shutouts = (L.shutouts || 0) + 1;
  gainRep(rep); checkAch(); save();
  if (pts.length) setTimeout(() => { toast('BADGE POINTS', pts.join(' · '), 'ach'); sfx('unlock'); }, 1600);
  uiResults(res, { vc, rep, bxp: bx, pts, notes }, () => launchGame(m, tier, st));
}
function afterPractice(res, back) {
  if (back === 'hub') enterWorld('hub', 13, 15, -2.4); else enterWorld('crib', 0, 9, Math.PI);
  if (res.practice === 'rack' && !res.quit) {
    const pay = res.rack * 5; S.vc += pay; S.life.bestRack = Math.max(S.life.bestRack || 0, res.rack); save(); checkAch();
    uiDialog('SHARPIE THE HUSTLER', res.rack >= 20 ? `${res.rack}?! Who ARE you. Take your ${pay} VC and stop embarrassing me.` : res.rack >= 8 ? `${res.rack} points. ${pay} VC. Respectable. Barely.` : `${res.rack} points. Here's ${pay} VC. Buy a jumpshot with it.`, [['Take the bag', null]]); sfx('buy');
  }
}

// ---------- loop ----------
let last = 0;
function frame(now) {
  requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
  pollInput();
  if (uiBusy()) uiStep(dt);
  if (MT) { if (!UI.cur && (IN[0].start || IN[1].start)) uiPause(); else matchStep(dt); }
  else if (W) worldStep(dt);
  else if (ST) studioStep(dt);
  if (scene) renderer.render(scene, camera);
}
function boot() {
  loadSave(); gfxInit(); setupTouch(); uiInit(); titleScene(); uiTitle();
  addEventListener('pointerdown', audioInit, { once: false });
  document.addEventListener('visibilitychange', () => { if (document.hidden && MT && !MT.practice && !UI.cur) uiPause(); });
  window.__pit = { get S() { return S; }, get MT() { return MT; }, get W() { return W; }, IN, keys, save, enterWorld, launchGame, uiClose, gainRep, checkAch, MODES, TIERS_COURT, startPractice, get UI() { return UI; } };
  window.__step = dt => { if (MT) matchStep(dt); };
  requestAnimationFrame(frame);
}
boot();
})();
</script>
