<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PITBORN 2145</title>
<style>
:root{--bg:#0c0c16;--pan:#151522;--pan2:#1e1e30;--ln:#2e2e48;--or:#ff5a3c;--ye:#ffc531;--cy:#33e0ff;--pk:#ff4fd8;--gr:#33ff88;--tx:#f2f2f7;--mu:#9a9ab4;
--f:Impact,'Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
h1,h2,h3,.f{font-family:var(--f);font-weight:400;letter-spacing:.04em;text-transform:uppercase;margin:0}
/* ---- touch ---- */
#touch{position:fixed;inset:0;z-index:5}
.stick{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);opacity:0;transition:opacity .12s;pointer-events:none}
.stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#stickR{border-color:rgba(255,197,49,.6)}#stickR i{background:rgba(255,197,49,.75)}
.tbtn{position:absolute;display:none;align-items:center;justify-content:center;width:70px;height:70px;border-radius:50%;font-family:var(--f);font-size:15px;letter-spacing:.05em;color:#fff;background:rgba(20,20,34,.55);border:3px solid rgba(255,255,255,.5);text-align:center;line-height:1}
.tbtn.on{background:rgba(255,255,255,.4);transform:scale(.93)}
body.touch .tbtn{display:flex}
#tA{right:calc(14px + var(--sar));bottom:calc(46% + 0px);border-color:var(--cy)}
#tB{right:calc(94px + var(--sar));bottom:calc(46% + 40px);border-color:var(--or)}
#tMenu{right:calc(10px + var(--sar));top:calc(8px + var(--sat));width:46px;height:46px;font-size:20px;border-width:2px}
body[data-state=world] #tB,body[data-state=title] .tbtn,body[data-state=create] .tbtn,body.busy .tbtn{display:none}
.hintL,.hintR{position:absolute;bottom:calc(18px + var(--sab));font-family:var(--f);font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.35);display:none;pointer-events:none}
.hintL{left:calc(26px + var(--sal))}.hintR{right:calc(26px + var(--sar));text-align:right}
body.touch:not(.busy)[data-state=match] .hintL,body.touch:not(.busy)[data-state=match] .hintR,body.touch:not(.busy)[data-state=world] .hintL,body.touch:not(.busy)[data-state=world] .hintR{display:block}
/* ---- world hud ---- */
#whud{position:fixed;left:calc(10px + var(--sal));top:calc(8px + var(--sat));z-index:6;display:none;pointer-events:none}
body[data-state=world] #whud{display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(12,12,22,.78);border:2px solid var(--ln);padding:4px 10px;margin:0 6px 6px 0;font-family:var(--f);font-size:17px;transform:skewX(-8deg)}
.chip b{font-weight:400;color:var(--ye)}.chip.rep b{color:var(--cy)}
#wtag{font-family:var(--f);font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.55)}
#repbar{width:150px;height:6px;background:#000;border:1px solid var(--ln);margin-top:2px}#repbar i{display:block;height:100%;background:var(--cy)}
#prompt{position:fixed;left:50%;bottom:calc(24% + var(--sab));transform:translateX(-50%) skewX(-8deg);z-index:7;display:none;background:var(--ye);color:#111;font-family:var(--f);font-size:20px;letter-spacing:.05em;padding:10px 22px;border:3px solid #111;box-shadow:5px 5px 0 #111;cursor:pointer;white-space:nowrap;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px) skewX(-8deg)}}
body:not([data-state=world]) #prompt{display:none!important}
#keys{position:fixed;left:10px;bottom:8px;z-index:6;font-size:12px;color:rgba(255,255,255,.45);pointer-events:none}body.touch #keys{display:none}body.busy #keys{display:none}
/* ---- match hud ---- */
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}
#sb{position:absolute;left:50%;top:calc(6px + var(--sat));transform:translateX(-50%);display:flex;align-items:stretch;font-family:var(--f);filter:drop-shadow(3px 3px 0 #000)}
#sb div{padding:3px 14px;font-size:26px;background:#151522;min-width:54px;text-align:center}
#sb .t0{background:#1d5fb8}#sb .t1{background:#b82a2a}#sb .lbl{font-size:12px;display:flex;align-items:center;letter-spacing:.1em;color:#ddd;padding:3px 8px}
#sb #clock{background:#000;color:var(--or);min-width:46px}
#modeTag{position:absolute;left:50%;top:calc(46px + var(--sat));transform:translateX(-50%);font-family:var(--f);font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.6);white-space:nowrap}
#bars{position:absolute;left:calc(10px + var(--sal));top:calc(8px + var(--sat));width:130px}
.bar{height:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);margin-bottom:4px;position:relative}.bar i{display:block;height:100%}
.bar span{position:absolute;left:3px;top:-3px;font-family:var(--f);font-size:10px;letter-spacing:.1em;text-shadow:1px 1px 0 #000}
#stam i{background:var(--gr)}#brav{height:13px}#brav i{background:linear-gradient(90deg,var(--or),var(--ye))}#brav.on{box-shadow:0 0 12px var(--ye);animation:pulse .4s infinite}
@keyframes pulse{50%{filter:brightness(1.6)}}
#call{position:absolute;left:0;right:0;top:19%;text-align:center;font-family:var(--f);transform:skewX(-8deg);opacity:0}
#call b{display:block;font-weight:400;font-size:min(11vw,64px);line-height:1;text-shadow:4px 4px 0 #000,-1px -1px 0 #000}#call small{font-size:min(4vw,20px);letter-spacing:.08em;text-shadow:2px 2px 0 #000}
#call.go{animation:callin 1.2s both}
@keyframes callin{0%{opacity:0;transform:skewX(-8deg) scale(2)}12%{opacity:1;transform:skewX(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:skewX(-8deg) translateY(-20px)}}
#fb{position:absolute;left:0;right:0;bottom:31%;text-align:center;font-family:var(--f);font-size:19px;letter-spacing:.05em;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .2s}
#meter{position:absolute;width:13px;height:92px;border:2px solid #fff;background:rgba(0,0,0,.65);display:none;border-radius:3px;overflow:hidden}
#meterZone{position:absolute;left:0;right:0;background:rgba(51,255,136,.55);border-top:1px solid #fff;border-bottom:1px solid #fff}#meterFill{position:absolute;left:0;right:0;bottom:0;background:#fff}
.flt{position:absolute;font-family:var(--f);font-size:20px;text-shadow:2px 2px 0 #000;animation:flt 1.1s forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes flt{to{margin-top:-50px;opacity:0}}
#rackHud{position:absolute;right:calc(12px + var(--sar));top:calc(60px + var(--sat));font-family:var(--f);font-size:30px;text-align:right;text-shadow:3px 3px 0 #000;display:none}
#clear{position:absolute;left:0;right:0;top:calc(72px + var(--sat));text-align:center;font-family:var(--f);font-size:15px;color:var(--or);letter-spacing:.1em;text-shadow:2px 2px 0 #000;display:none}
/* ---- panels ---- */
#panel{position:fixed;inset:0;z-index:20;display:none;background:rgba(8,8,16,.86);overflow:hidden}
#panel.side{background:linear-gradient(90deg,rgba(8,8,16,0) 0,rgba(8,8,16,.0) 36%,rgba(8,8,16,.93) 46%)}
#panel.clear{background:rgba(8,8,16,.45)}
.pin{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(10px + var(--sat)) calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal));max-width:980px;margin:0 auto}
#panel.side .pin{left:42%;max-width:none}
@media (orientation:portrait){#panel.side{background:linear-gradient(180deg,rgba(8,8,16,0) 0,rgba(8,8,16,0) 30%,rgba(8,8,16,.95) 38%)}#panel.side .pin{left:0;top:36%}}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex:none}.ph h2{font-size:28px;color:var(--ye);transform:skewX(-8deg);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:4px;min-height:0}
.pf{flex:none;display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{font-family:var(--f);font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:#111;background:var(--ye);border:3px solid #111;box-shadow:4px 4px 0 #000;padding:8px 16px;cursor:pointer;transform:skewX(-8deg);outline:none;white-space:nowrap}
.btn.alt{background:var(--pan2);color:var(--tx);border-color:var(--ln)}.btn.red{background:var(--or)}.btn.cy{background:var(--cy)}.btn.sm{font-size:14px;padding:5px 10px;box-shadow:3px 3px 0 #000}
.btn:disabled,.btn[disabled]{opacity:.38;cursor:default}.btn.focus{outline:3px solid #fff;outline-offset:2px}.btn:active{transform:skewX(-8deg) translate(2px,2px);box-shadow:2px 2px 0 #000}
.tabs{display:flex;gap:5px;overflow-x:auto;flex:none;margin-bottom:8px;touch-action:pan-x;padding-bottom:4px}.tabs .btn{font-size:14px;padding:5px 11px;flex:none}.tabs .btn.sel{background:var(--or);color:#fff}
.card{background:var(--pan);border:2px solid var(--ln);padding:9px 11px;margin-bottom:7px;position:relative}
.card h3{font-size:18px}.card p{margin:2px 0 0;color:var(--mu);font-size:13px}.card.sel{border-color:var(--ye);background:#22203a}.card.lock{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px}.grid .card{margin:0}
.row{display:flex;align-items:center;gap:8px}.row .g{flex:1;min-width:0}
.ab{height:10px;background:#000;border:1px solid var(--ln);position:relative;flex:1}.ab i{position:absolute;left:0;top:0;bottom:0}.ab u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
.an{width:108px;font-size:13px;flex:none}.av{width:52px;text-align:right;font-family:var(--f);font-size:17px;flex:none}.av small{color:var(--mu);font-size:11px}
.cat{font-family:var(--f);font-size:15px;letter-spacing:.1em;margin:10px 0 4px}
.pips{display:flex;gap:3px}.pips i{width:16px;height:8px;background:#000;border:1px solid var(--ln);transform:skewX(-14deg)}
.tag{font-family:var(--f);font-size:11px;letter-spacing:.1em;padding:1px 6px;display:inline-block}
.buff{color:var(--gr);font-size:12px}
.sw{width:34px;height:34px;border:3px solid #111;display:inline-block;margin-right:6px;cursor:pointer}.sw.sel{border-color:#fff}
input[type=range]{width:100%;accent-color:var(--ye);height:28px;touch-action:pan-x}input[type=text],textarea{width:100%;background:#000;border:2px solid var(--ln);color:var(--tx);font:16px ui-monospace,monospace;padding:8px;user-select:text;-webkit-user-select:text}
label.sl{display:block;font-family:var(--f);font-size:13px;letter-spacing:.08em;color:var(--mu);margin-top:6px}label.sl b{color:var(--tx);font-weight:400;float:right}
.big{font-family:var(--f);font-size:52px;line-height:1}.mu{color:var(--mu)}.ye{color:var(--ye)}.cy{color:var(--cy)}.gr{color:var(--gr)}.or{color:var(--or)}
.hdr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px;flex:none}.hdr .ovr{font-family:var(--f);font-size:40px;color:#111;background:var(--ye);padding:0 12px;transform:skewX(-8deg);line-height:1.15}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:3px 5px;text-align:right;border-bottom:1px solid var(--ln)}td:first-child,th:first-child{text-align:left}th{font-family:var(--f);font-weight:400;color:var(--mu);letter-spacing:.08em}
/* title */
#title{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(255,90,60,.25),rgba(8,8,16,.82) 70%)}
#title h1{font-size:min(19vw,150px);line-height:.85;color:var(--ye);text-shadow:6px 6px 0 var(--or),12px 12px 0 #000;transform:skewX(-8deg) rotate(-3deg)}
#title h1 span{display:block;font-size:.42em;color:#fff;text-shadow:4px 4px 0 var(--pk),8px 8px 0 #000;letter-spacing:.2em}
#title p{font-family:var(--f);letter-spacing:.16em;color:#ddd;margin:26px 0 20px;font-size:min(4vw,17px)}#title .pf{justify-content:center}
#title small{position:absolute;bottom:calc(8px + var(--sab));color:var(--mu);font-size:11px;left:0;right:0}
/* toasts */
#toasts{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,420px)}
.toast{background:#111;border:3px solid var(--ye);box-shadow:5px 5px 0 #000;padding:7px 14px;font-family:var(--f);font-size:17px;letter-spacing:.04em;transform:skewX(-8deg);animation:tin 3.4s forwards;width:100%;text-align:center}
.toast small{display:block;font-family:system-ui;font-size:12px;color:var(--mu);letter-spacing:0}.toast.ach{border-color:var(--pk)}.toast.rank{border-color:var(--cy);font-size:22px}
@keyframes tin{0%{opacity:0;transform:skewX(-8deg) translateY(-30px) scale(.8)}8%{opacity:1;transform:skewX(-8deg) scale(1.06)}12%{transform:skewX(-8deg) scale(1)}88%{opacity:1}100%{opacity:0}}
@media (orientation:portrait){#tA{bottom:27%}#tB{bottom:calc(27% + 44px)}#bars{top:calc(66px + var(--sat))}#fb{bottom:40%}}
#rot{display:none}
</style>
</head>
