  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

    puffer:function(){var cur=B.jacket?B.jacket():'';return '<h2>PUFFER</h2><p>Each song has its own. Pick one here to keep it on for every song.</p><div class="grid">'+B.jackets.map(function(n){return '<button class="sw'+(manualJacket===n?' on':'')+'" data-jacket="'+n+'"><u style="background:'+JCOL[n]+'"></u>'+n+'</button>';}).join('')+'</div><h3>OR</h3><div class="grid"><button data-act="jackauto" class="'+(manualJacket?'':'on')+'">'+(manualJacket?'go back to each song’s own':'✓ each song’s own')+'</button></div>';},

    faces:function(){return '<h2>FACES</h2>'+followChip()+'<h3>EXPRESSIONS</h3>'+chips(B.faces,'face',follow?'':curFace)+'<h3>SCREEN ICONS</h3>'+chips(B.icons,'face',follow?'':curFace);},
    tap:function(){return '<h2>TAP TIMING · '+esc(CUR.title.toUpperCase())+'</h2><p>'+(CUR.src?'Play the song and tap once at the start of each line. Your times are used at once and kept in this browser.':'This song has no recording here. Add one in Songs first, or tap along to it playing on something else: the run-through clock still counts.')+'</p><div class="grid"><button class="go" data-act="tapstart">⏱ start tapping from the top</button><button data-act="slow" class="'+(song.playbackRate<1?'on':'')+'">½ speed</button></div>'
      +'<h3>NUDGE EVERY LINE</h3><div class="grid"><button data-act="back">−¼s</button><button data-act="fwd">+¼s</button><span style="font:600 12px var(--mono);align-self:center">offset '+(offset>0?'+':'')+offset.toFixed(2)+'s</span></div>'
      +'<h3>THIS SONG’S TIMING</h3><div class="grid"><span style="align-self:center;color:var(--gold)">'+(CUR.mine?'using your timing':'using the bar grid')+'</span><button data-act="copy">copy the times</button><button data-act="reset"'+(CUR.mine?'':' disabled')+'>reset to the grid</button></div>';},
    lines:function(){var hh='<h2>'+esc(CUR.title.toUpperCase())+'</h2><p>Tap a line to jump to it. −/+ moves that one line by a tenth of a second.</p>',sec='';LINES.forEach(function(L,i){if(L[1]!==sec){sec=L[1];hh+='<h3>'+esc(sec.toUpperCase())+'</h3>';}hh+='<div class="ln'+(i===lastK?' cur':'')+'" data-k="'+i+'" role="button" tabindex="0"><span>#'+(i+1)+'</span><span>'+fmt(L[0])+'</span><span>'+esc(L[2])+'</span><span class="nu"><button data-n="'+i+'" data-d="-0.1">−</button><button data-n="'+i+'" data-d="0.1">+</button></span><small>'+L[3]+' · '+L[4]+' / '+L[5]+(L[6]?' · icon '+L[6]:'')+'</small></div>';});return hh;}
  };
  function render(){[].forEach.call($('tabs').querySelectorAll('[data-tab]'),function(b){b.className=b.dataset.tab===tab?'on':'';});var s=$('sheet');if(!tab){s.hidden=true;size();return;}var keep=s.scrollTop;s.innerHTML=PANELS[tab]();s.hidden=false;s.scrollTop=keep;size();}
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;tab=tab===b.dataset.tab?null:b.dataset.tab;$('sheet').scrollTop=0;render();});
  $('hide').onclick=function(){document.body.classList.add('clean');$('show').hidden=false;size();};$('show').onclick=function(){document.body.classList.remove('clean');this.hidden=true;size();};
  $('sheet').addEventListener('click',function(e){var t=e.target,b;
    if((b=t.closest('[data-n]'))){var k=+b.dataset.n;LINES[k][0]=Math.max(0,Math.round((LINES[k][0]+ +b.dataset.d)*100)/100);store();jump(k);render();return;}

      else if(a==='tapstart'){tapStart();return;}else if(a==='slow'){var r=song.playbackRate<1?1:.5;AUDIO.playbackRate=VC.playbackRate=r;}
      else if(a==='back'||a==='fwd'){offset=Math.round((offset+(a==='back'?-.25:.25))*100)/100;lastK=-9;}else if(a==='reset'){resetTiming();return;}
      else if(a==='copy'){var txt=CUR.title+' line start times (seconds):\n'+JSON.stringify(LINES.map(function(L){return Math.round((L[0]+offset)*100)/100;}));if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){b.textContent='copied ✓';},function(){prompt2(txt);});else prompt2(txt);return;}
      render();}});
  function prompt2(txt){$('tapper').hidden=false;$('taptitle').textContent='COPY THESE';$('taphelp').textContent='Select the text and copy it.';$('tapprog').textContent=$('tapnext').textContent=$('tapafter').textContent='';$('tapbtn').hidden=true;$('tapout').hidden=false;$('tapout').value=txt;$('tapdone').hidden=true;$('tapout').focus();$('tapout').select();}
  // ---- tap along: one tap at the start of each line
  var TAP={on:false,n:0,t:[]};
  function tapShow(){var n=TAP.n,done=n>=LINES.length;$('tapprog').textContent=done?'all '+LINES.length+' lines timed':'line '+(n+1)+' of '+LINES.length+' · '+LINES[Math.min(n,LINES.length-1)][1];$('tapnext').textContent=done?'Done.':LINES[n][2];$('tapafter').textContent=done?'':(LINES[n+1]?'then: '+LINES[n+1][2]:'(last line)');
    $('tapbtn').hidden=done;$('tapout').hidden=!done;$('tapdone').hidden=!done;if(done){TAP.t.forEach(function(t,i){LINES[i][0]=t;});offset=0;store();$('tapout').value=CUR.title+' line start times (seconds):\n'+JSON.stringify(TAP.t);$('taphelp').textContent='Saved in this browser. Close this and press play to watch it with your timing. Copy the numbers and send them to make them permanent.';}}
  function tapStart(){TAP.on=true;TAP.n=0;TAP.t=[];$('tapper').hidden=false;$('taptitle').textContent='TIME THE LYRICS · '+CUR.title.toUpperCase();$('taphelp').innerHTML='The song plays from the start. Tap the big button (or press Space) the moment he <b>starts</b> each line. Wrong tap? Use undo.';setFollow(true);AUDIO.playbackRate=VC.playbackRate=1;started=true;song.currentTime=0;play();tapShow();}
  function tapHit(){if(!TAP.on||TAP.n>=LINES.length)return;TAP.t.push(Math.max(0,Math.round((song.currentTime-.08)*100)/100));TAP.n++;tapShow();}
  $('tapbtn').addEventListener('pointerdown',function(e){e.preventDefault();tapHit();});
  $('tapundo').onclick=function(){if(!TAP.on||!TAP.n)return;TAP.n--;var t=TAP.t.pop();song.currentTime=Math.max(0,t-3);if(song.paused)play();tapShow();};$('taprestart').onclick=function(){if(TAP.on)tapStart();};
  $('tapquit').onclick=function(){TAP.on=false;$('tapper').hidden=true;lastK=-9;render();};
  $('tapcopy').onclick=function(){var ta=$('tapout');function fb(){ta.focus();ta.select();$('tapmsg').textContent='selected: copy it';}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(function(){$('tapmsg').textContent='copied';},fb);else fb();};
  addEventListener('keydown',function(e){if(TAP.on&&e.code==='Space'){e.preventDefault();if(!e.repeat)tapHit();}});
  var h=location.hash.slice(1).split('-');if(h[0]&&B.poses.indexOf(h[0])>=0){follow=false;curPose=h[0];B.setPose(h[0]);}if(h[1]){follow=false;curFace=h[1];B.setFace(h[1]);}if(h[2]){yaw=+h[2];auto=false;}if(h[3]){manualJacket=h[3];B.setJacket(h[3]);}
  var zoomF=1;
  function size(){var w=innerWidth,hh=innerHeight;R.setSize(w,hh,false);cam.aspect=w/hh;cam.fov=w<hh?56:42;var clean=document.body.classList.contains('clean'),sheet=$('sheet'),side=!clean&&!sheet.hidden&&w>=860,bars=clean?0:$('ui').offsetHeight;
    if(side){sheet.style.bottom='0px';bars=$('ui').offsetHeight;sheet.style.bottom=bars+'px';}else sheet.style.bottom='';
    var uh=clean?40:bars+34,sw=side?400:0,avail=Math.max(120,hh-uh),visH=2*9.2*Math.tan(cam.fov*Math.PI/360),visW=visH*(w-sw)/hh;zoomF=Math.max(1,6.2/(visH*avail/hh),5.2/visW);
    cam.setViewOffset(w,hh,Math.round(sw/2),Math.round(uh/2),w,hh);cam.updateProjectionMatrix();$('lyric').style.bottom=clean?'':(bars+6)+'px';$('lyric').style.right=side?(sw+16)+'px':'';}
  addEventListener('resize',size);$('now').textContent=CUR.title;AUDIO.setAttribute('data-id',CUR.id);size();
  var t0=performance.now(),last=t0;(function loop(now){requestAnimationFrame(loop);var t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
    if(song===VC&&!VC.paused){VC.currentTime+=dt*VC.playbackRate;if(VC.currentTime>=VC.duration){VC.pause();VC.currentTime=0;ended();}}
    var playing=started&&!song.paused,pt=playing?'❚❚':'▶';if($('play').textContent!==pt)$('play').textContent=pt;if(auto){if(playing)yaw=Math.sin(t*.22)*.7;else yaw+=dt*.35;}
    if(started){var ct=song.currentTime,k=lineAt(ct),dur=song.duration||VC.duration;$('clock').textContent=fmt(ct)+' / '+fmt(dur);$('bar').firstChild.style.width=(ct/dur*100)+'%';
      var past=k>=0&&k===LINES.length-1&&ct-(LINES[k][0]+offset)>3.6,L=k>=0&&!past?LINES[k]:null;
      if(k!==lastK||past&&lastK!==-3){lastK=past?-3:k;lineT0=ct;$('sec').textContent=L?'#'+(k+1)+' · '+fmt(L[0]+offset)+' · '+L[1].toUpperCase():past?'NO MORE LINES ON THE SHEET':'';$('line').textContent=L?L[2]:'';
        if(tab==='lines'){var cur=$('sheet').querySelector('.cur');if(cur)cur.classList.remove('cur');var el=$('sheet').querySelector('.ln[data-k="'+k+'"]');if(el&&L){el.classList.add('cur');el.scrollIntoView({block:'nearest'});}}
        if(follow){if(L){B.setPose(L[3]);B.setExpression(L[4],L[5]);if(L[6])B.setIcon(L[6]);}else{B.setPose(past?'dance':'idle');B.setExpression('happy','smile');}}}
      if(follow&&L&&L[6]&&ct-lineT0>.9&&ct-lineT0<1.1)B.setExpression(L[4],L[5]);
      if(playing){var lvl=.5+.5*Math.sin(t*14)*Math.sin(t*3.1);if(an&&CUR.src){an.getByteFrequencyData(buf);var s=0;for(var i2=6;i2<60;i2++)s+=buf[i2];lvl=Math.min(1,s/54/150);}
        if(follow&&!(L&&L[6]&&ct-lineT0<=.9))B.setMouth(L?lvl:0);ring.material.color.setHSL((t*.2)%1,1,.55);floorM.color.setScalar(.42+lvl*.3);}}
    B.update(t,dt,playing?(CUR.id==='the-algorithm'?song.currentTime-28.45+offset:song.currentTime):undefined);
    var dd=dist*zoomF;cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dd,2.1+Math.sin(pitch)*dd,Math.cos(yaw)*Math.cos(pitch)*dd);cam.lookAt(0,1.95,0);R.render(scene,cam);})(t0);
  B.setJacket(manualJacket||JACK[CUR.id]||'silver');
  window.__lb={B:B,SONGS:SONGS,TAP:TAP,jump:jump,lineAt:lineAt,clock:function(){return song;},cur:function(){return CUR;},LINES:ALGO,song:AUDIO};
})();
