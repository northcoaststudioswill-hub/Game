<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GOT NEXT</title>
<style>
/* GOT NEXT — brand system. One dark look, on purpose. See docs/BRAND.md.
   Layout idea: everything hangs off the left edge like a hangtag; type is wide and heavy, labels are small mono. */
@font-face{font-family:'Archivo';src:url(data:font/woff2;base64,/*@font archivo.woff2*/) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url(data:font/woff2;base64,/*@font jbmono.woff2*/) format('woff2');font-weight:100 800;font-display:block}
:root{color-scheme:dark;
/* ground */  --ink:#08080a;--tar:#111114;--grit:#1a1a1f;--line:#2c2c35;
/* type */    --bone:#ece9e2;--ash:#8d8d99;
/* signal */  --heat:#ff2d78;--gold:#f2c14e;--ice:#7de3ff;--go:#3dffa0;--warn:#ff8a3c;
/* flash */   --foil:linear-gradient(100deg,#ff2d78 0%,#ffb86b 22%,#fff3b0 40%,#7de3ff 60%,#a78bff 80%,#ff2d78 100%);
/* faces */   --d:'Archivo','Arial Black','Helvetica Neue',Arial,sans-serif;--b:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
--cut:10px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font:400 14px/1.4 var(--b);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
h1,h2,h3,.f{font-family:var(--d);font-weight:900;font-stretch:125%;letter-spacing:-.01em;text-transform:uppercase;margin:0;line-height:1}
.mono,.tag,.cat,label.sl,th{font-family:var(--m);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.foil{background:var(--foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 5s linear infinite}
@keyframes foil{to{background-position:-220% 0}}
/* ---- touch ---- */
#touch{position:fixed;inset:0;z-index:5}
.stick{position:absolute;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(236,233,226,.4);background:rgba(8,8,10,.25);opacity:0;transition:opacity .12s;pointer-events:none}
.stick i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(236,233,226,.8)}
#stickR{border-color:var(--heat)}#stickR i{background:var(--heat)}
.tbtn{position:absolute;display:none;align-items:center;justify-content:center;width:68px;height:68px;border-radius:50%;font:700 10px var(--m);letter-spacing:.1em;color:var(--bone);background:rgba(8,8,10,.55);border:1.5px solid rgba(236,233,226,.55);text-align:center;line-height:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tbtn.on{background:var(--bone);color:var(--ink);transform:scale(.94)}
body.touch .tbtn{display:flex}
#tA{right:calc(14px + var(--sar));bottom:46%}
#tB{right:calc(92px + var(--sar));bottom:calc(46% + 40px);border-color:var(--heat)}
#tMenu{right:calc(10px + var(--sar));top:calc(8px + var(--sat));width:42px;height:42px;font-size:16px;border-radius:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
body[data-state=world] #tB,body[data-state=title] .tbtn,body[data-state=create] .tbtn,body.busy .tbtn{display:none}
.hintL,.hintR{position:absolute;bottom:calc(16px + var(--sab));font:500 10px var(--m);letter-spacing:.14em;color:rgba(236,233,226,.4);display:none;pointer-events:none}
.hintL{left:calc(24px + var(--sal))}.hintR{right:calc(24px + var(--sar));text-align:right}
body.touch:not(.busy)[data-state=match] .hintL,body.touch:not(.busy)[data-state=match] .hintR,body.touch:not(.busy)[data-state=world] .hintL,body.touch:not(.busy)[data-state=world] .hintR{display:block}
/* ---- world hud ---- */
#whud{position:fixed;left:calc(12px + var(--sal));top:calc(10px + var(--sat));z-index:6;display:none;pointer-events:none}
body[data-state=world] #whud{display:block}
.chip{display:inline-flex;align-items:baseline;gap:6px;background:rgba(8,8,10,.72);border:1px solid var(--line);padding:5px 10px;margin:0 6px 6px 0;font:500 10px var(--m);letter-spacing:.1em;color:var(--ash);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip b{font:900 15px var(--d);font-stretch:125%;letter-spacing:0;color:var(--gold)}.chip.rep b{color:var(--ice);font-size:12px}
#wtag{font:500 10px var(--m);letter-spacing:.16em;color:rgba(236,233,226,.5);margin-top:6px}
#repbar{width:150px;height:2px;background:var(--line)}#repbar i{display:block;height:100%;background:var(--ice)}
#prompt{position:fixed;left:50%;bottom:calc(24% + var(--sab));transform:translateX(-50%);z-index:7;display:none;background:var(--bone);color:var(--ink);font:900 14px var(--d);font-stretch:125%;text-transform:uppercase;padding:12px 26px 12px 18px;cursor:pointer;white-space:nowrap;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%);border-left:4px solid var(--heat)}
body:not([data-state=world]) #prompt{display:none!important}
#keys{position:fixed;left:12px;bottom:8px;z-index:6;font:500 10px var(--m);letter-spacing:.06em;color:rgba(236,233,226,.4);pointer-events:none}body.touch #keys,body.busy #keys{display:none}
/* ---- match hud ---- */
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}
#sb{position:absolute;left:50%;top:calc(8px + var(--sat));transform:translateX(-50%);display:flex;align-items:stretch;background:rgba(8,8,10,.8);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#sb div{padding:4px 14px;font:900 24px var(--d);font-stretch:125%;min-width:52px;text-align:center;line-height:1.15}
#sb .t0{box-shadow:inset 0 -3px 0 var(--ice)}#sb .t1{box-shadow:inset 0 -3px 0 var(--heat)}
#sb .lbl{font:500 10px var(--m);display:flex;align-items:center;letter-spacing:.12em;color:var(--ash);padding:4px 10px;text-transform:uppercase}
#sb #clock{background:var(--bone);color:var(--ink);min-width:46px;font-size:18px;display:flex;align-items:center;justify-content:center}
#modeTag{position:absolute;left:50%;top:calc(48px + var(--sat));transform:translateX(-50%);font:500 9px var(--m);letter-spacing:.18em;color:rgba(236,233,226,.55);white-space:nowrap;text-transform:uppercase}
#bars{position:absolute;left:calc(12px + var(--sal));top:calc(10px + var(--sat));width:120px}
.bar{height:3px;background:rgba(236,233,226,.16);margin-bottom:16px;position:relative}.bar i{display:block;height:100%}
.bar span{position:absolute;left:0;top:5px;font:500 8px var(--m);letter-spacing:.16em;color:rgba(236,233,226,.6)}
#stam i{background:var(--bone)}#brav i{background:var(--foil)}#brav.on{box-shadow:0 0 14px var(--heat);animation:pulse .4s infinite}
@keyframes pulse{50%{filter:brightness(1.7)}}
#call{position:absolute;left:0;right:0;top:20%;text-align:center;opacity:0;transform:skewX(-7deg)}
#call b{display:block;font:900 min(10vw,60px)/0.95 var(--d);font-stretch:125%;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 2px 0 var(--ink),0 0 24px rgba(8,8,10,.8);padding:0 12px}
#call small{font:500 min(3.2vw,13px) var(--m);letter-spacing:.14em;text-transform:uppercase;background:var(--ink);padding:3px 8px;display:inline-block;margin-top:6px}#call small:empty{display:none}
#call.go{animation:callin 1.2s both}
@keyframes callin{0%{opacity:0;transform:skewX(-7deg) translateX(-40px)}10%{opacity:1;transform:skewX(-7deg)}82%{opacity:1}100%{opacity:0;transform:skewX(-7deg) translateX(30px)}}
#fb{position:absolute;left:0;right:0;bottom:31%;text-align:center;font:700 11px var(--m);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 0 var(--ink),0 0 10px var(--ink);opacity:0;transition:opacity .2s}
#meter{position:absolute;width:8px;height:92px;background:rgba(8,8,10,.75);display:none;outline:1px solid rgba(236,233,226,.7);overflow:hidden}
#meterZone{position:absolute;left:0;right:0;background:var(--go)}#meterFill{position:absolute;left:0;right:0;bottom:0;background:var(--bone);mix-blend-mode:difference}
.flt{position:absolute;font:900 16px var(--d);font-stretch:125%;text-transform:uppercase;text-shadow:0 2px 0 var(--ink);animation:flt 1.1s forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes flt{to{margin-top:-50px;opacity:0}}
#rackHud{position:absolute;right:calc(14px + var(--sar));top:calc(60px + var(--sat));font:900 30px var(--d);font-stretch:125%;text-align:right;text-shadow:0 2px 0 var(--ink);display:none}
#clear{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + var(--sat));font:700 10px var(--m);background:var(--warn);color:var(--ink);padding:3px 10px;letter-spacing:.14em;display:none;white-space:nowrap}
/* ---- panels ---- */
#panel{position:fixed;inset:0;z-index:35;display:none;background:rgba(8,8,10,.9);overflow:hidden}
#panel.side{background:linear-gradient(90deg,rgba(8,8,10,0) 0,rgba(8,8,10,0) 34%,rgba(8,8,10,.96) 44%)}
#panel.clear{background:linear-gradient(180deg,rgba(8,8,10,.1),rgba(8,8,10,.75))}
.pin{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(14px + var(--sat)) max(16px,var(--sar)) calc(12px + var(--sab)) max(16px,var(--sal));max-width:1000px;margin:0 auto}
#panel.side .pin{left:42%;max-width:none}
@media (orientation:portrait){#panel.side{background:linear-gradient(180deg,rgba(8,8,10,0) 0,rgba(8,8,10,0) 28%,rgba(8,8,10,.97) 37%)}#panel.side .pin{left:0;top:35%}}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex:none}
.ph h2{font-size:clamp(22px,4.4vw,34px);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:12px;border-left:4px solid var(--heat)}
.pb{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:4px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pf{flex:none;display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.btn{font:900 12px var(--d);font-stretch:125%;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);background:var(--bone);border:0;padding:12px 22px 12px 16px;cursor:pointer;outline:none;white-space:nowrap;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%);transition:background .12s,transform .08s}
.btn.alt{background:var(--grit);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line)}.btn.red{background:var(--heat);color:#fff}.btn.cy{background:var(--ice)}
.btn.sm{font-size:10px;padding:8px 16px 8px 11px;--cut:7px}
.btn:disabled,.btn[disabled]{opacity:.3;cursor:default}.btn.focus{background:var(--heat);color:#fff}.btn:active:not(:disabled){transform:translateY(1px);background:var(--heat);color:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:none;margin-bottom:12px;touch-action:pan-x;scrollbar-width:none;border-bottom:1px solid var(--line)}.tabs::-webkit-scrollbar{display:none}
.tabs .btn{font-size:10px;padding:10px 14px;flex:none;clip-path:none;background:transparent;color:var(--ash);box-shadow:none}.tabs .btn.sel{color:var(--bone);box-shadow:inset 0 -3px 0 var(--heat)}.tabs .btn.focus{background:var(--grit);color:var(--bone)}
.card{background:var(--tar);border:1px solid var(--line);padding:11px 12px;margin-bottom:6px;position:relative}
.card h3{font-size:13px;line-height:1.15}.card p{margin:4px 0 0;color:var(--ash);font-size:12.5px;line-height:1.35}
.card[data-k]{cursor:pointer}.card.sel{border-color:var(--bone);background:var(--grit)}.card.sel::after{content:"";position:absolute;right:0;top:0;border:7px solid var(--heat);border-left-color:transparent;border-bottom-color:transparent}.card.lock{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:6px}.grid .card{margin:0}
.row{display:flex;align-items:center;gap:8px}.row .g{flex:1;min-width:0}
.ab{height:4px;background:var(--line);position:relative;flex:1}.ab i{position:absolute;left:0;top:0;bottom:0}
.an{width:104px;font-size:12.5px;font-weight:600;flex:none}.av{width:54px;text-align:right;font:900 14px var(--d);font-stretch:125%;flex:none;font-variant-numeric:tabular-nums}.av small{color:var(--ash);font:500 10px var(--m)}
.cat{font-size:10px;letter-spacing:.16em;margin:16px 0 6px;color:var(--ash);display:flex;gap:8px;align-items:center}.cat::before{content:"";width:14px;height:2px;background:currentColor;flex:none}
.pips{display:flex;gap:3px;align-items:center}.pips i{width:18px;height:3px;background:var(--line)}
.tag{font-size:9px;letter-spacing:.12em;padding:2px 0;display:inline-block;color:var(--ash)}.tag.on{background:var(--bone);color:var(--ink);padding:3px 7px;font-weight:700}.tag.hot{background:var(--go);color:var(--ink);padding:3px 7px;font-weight:700}
.buff{color:var(--go);font-size:11.5px}
.sw{width:32px;height:32px;display:inline-block;margin-right:6px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}.sw.sel{outline:2px solid var(--bone);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--heat);height:28px;touch-action:pan-x}input[type=text],textarea{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--bone);font:500 15px var(--m);padding:10px;user-select:text;-webkit-user-select:text;border-radius:0;outline:none}input[type=text]:focus,textarea:focus{border-color:var(--bone)}
label.sl{display:block;font-size:10px;color:var(--ash);margin-top:8px}label.sl b{color:var(--bone);font:900 13px var(--d);font-stretch:125%;float:right;letter-spacing:0}
.big{font:900 46px/1 var(--d);font-stretch:125%;font-variant-numeric:tabular-nums}.mu{color:var(--ash)}.ye{color:var(--gold)}.cy{color:var(--ice)}.gr{color:var(--go)}.or{color:var(--warn)}
.hdr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;flex:none}.hdr .ovr{font:900 34px/1 var(--d);font-stretch:125%;color:var(--ink);background:var(--bone);padding:8px 12px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.hdr .sub{font:500 10px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}td,th{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}th{font-size:9px;color:var(--ash)}
/* ---- title ---- */
#title{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;justify-content:flex-end;background:linear-gradient(75deg,rgba(8,8,10,.94) 0%,rgba(8,8,10,.72) 42%,rgba(8,8,10,.1) 100%),linear-gradient(0deg,rgba(8,8,10,.9),rgba(8,8,10,0) 45%);padding:calc(18px + var(--sat)) max(22px,var(--sar)) calc(40px + var(--sab)) max(22px,var(--sal))}
#title .top{position:absolute;left:max(22px,var(--sal));right:max(22px,var(--sar));top:calc(18px + var(--sat));display:flex;justify-content:space-between;align-items:flex-start;font:500 10px var(--m);letter-spacing:.16em;color:var(--ash);text-transform:uppercase}
.gnmark{width:38px;height:38px;background:var(--bone);display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
#title .eyebrow{font:500 10px var(--m);letter-spacing:.22em;color:var(--heat);text-transform:uppercase;margin-bottom:10px}
#title h1{font-size:min(23vw,25vh,190px);line-height:.8;letter-spacing:-.045em;transform:skewX(-7deg);transform-origin:left bottom}
#title h1 span{display:block}
#title p{font:500 12px/1.5 var(--b);color:var(--ash);margin:18px 0 20px;max-width:34ch}
#title .pf{margin:0;flex-direction:column;align-items:flex-start;gap:6px}#title .pf .btn{min-width:240px;font-size:13px;padding:15px 26px 15px 18px;text-align:left}#title .pf .btn:first-child{background:var(--heat);color:#fff}
#ticker{position:absolute;left:0;right:0;bottom:var(--sab);height:24px;overflow:hidden;border-top:1px solid var(--line);background:var(--ink);font:500 9.5px/24px var(--m);letter-spacing:.2em;color:var(--ash);white-space:nowrap;text-transform:uppercase}
#ticker span{display:inline-block;padding-left:100%;animation:tick 38s linear infinite}#ticker b{color:var(--heat);font-weight:500}
@keyframes tick{to{transform:translateX(-100%)}}
/* ---- toasts ---- */
#toasts{position:fixed;right:max(12px,var(--sar));top:calc(10px + var(--sat));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none;width:min(88vw,340px)}
.toast{background:rgba(17,17,20,.96);border:1px solid var(--line);border-left:3px solid var(--gold);padding:9px 12px;font:900 12px/1.2 var(--d);font-stretch:125%;text-transform:uppercase;animation:tin 3.4s forwards;width:100%}
.toast small{display:block;font:500 10px/1.4 var(--m);letter-spacing:.04em;text-transform:none;color:var(--ash);margin-top:3px}.toast.ach{border-left-color:var(--heat)}.toast.rank{border-left-color:var(--ice);font-size:15px}
@keyframes tin{0%{opacity:0;transform:translateX(40px)}6%{opacity:1;transform:none}90%{opacity:1}100%{opacity:0}}
@media (orientation:portrait){#tA{bottom:27%}#tB{bottom:calc(27% + 44px)}#bars{top:calc(70px + var(--sat))}#fb{bottom:40%}}
@media (prefers-reduced-motion:reduce){.foil,#ticker span,#brav.on{animation:none}}
</style>
</head>
<body data-state="title">
<canvas id="gl"></canvas>
<div id="touch">
  <div class="stick" id="stickL"><i></i></div><div class="stick" id="stickR"><i></i></div>
  <div class="hintL">MOVE</div><div class="hintR" id="hintR">SKILL STICK</div>
  <div class="tbtn" id="tA">PASS</div><div class="tbtn" id="tB">SHOOT</div><div class="tbtn" id="tMenu">≡</div>
</div>
<div id="whud"><div><span class="chip">VC <b id="wvc">0</b></span><span class="chip rep"><b id="wrank">—</b></span></div><div id="repbar"><i></i></div><div id="wtag"></div></div>
<div id="prompt"></div>
<div id="keys"></div>
<div id="hud">
  <div id="bars"><div class="bar" id="stam"><i></i><span>STAMINA</span></div><div class="bar" id="brav"><i></i><span>BRAVADO</span></div></div>
  <div id="sb"><div class="lbl" id="n0">YOU</div><div class="t0" id="s0">0</div><div id="clock">14</div><div class="t1" id="s1">0</div><div class="lbl" id="n1">THEM</div></div>
  <div id="modeTag"></div><div id="clear">TAKE IT BACK ↓ PAST THE ARC</div><div id="rackHud"></div>
  <div id="call"><b></b><small></small></div><div id="fb"></div>
  <div id="meter"><div id="meterZone"></div><div id="meterFill"></div></div><div id="flts"></div>
</div>
<div id="panel"></div>
<div id="title">
  <div class="top">
    <div class="gnmark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M2 3h6l7 8-7 8H2l7-8zM11 3h4l6 8-6 8h-4l6-8z" fill="#08080a"/></svg></div>
    <div style="text-align:right"><span id="seasonTag"></span><br>USA · 2145</div>
  </div>
  <div class="eyebrow">Half court · Winners stay</div>
  <h1><span>GOT</span><span class="foil">NEXT</span></h1>
  <p id="titleLine"></p>
  <div class="pf" id="titleBtns"></div>
  <div id="ticker"><span id="tickerTxt"></span></div>
</div>
<div id="toasts"></div>
<script>/*@three*/</script>
